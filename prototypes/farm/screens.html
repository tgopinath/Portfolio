<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm Manager Screens</title>
<style>
:root{--bg:#F5F3EC;--ink:#15161F;--muted:#6B6F80;--line:#E2DED2;--accent:#2F6B3A;--frame:#0B0B10}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0C0D12;--ink:#ECEDF3;--muted:#9A9DAE;--line:#2A2C38;--accent:#6FB57C;--frame:#2A2A36}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0C0D12;--ink:#ECEDF3;--muted:#9A9DAE;--line:#2A2C38;--accent:#6FB57C;--frame:#2A2A36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;padding:32px 16px 48px}
.wrap{max-width:1080px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.chip{font-size:12px;font-weight:600;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 24px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
figure{margin:0;display:flex;flex-direction:column;gap:12px}
.phone{background:var(--frame);border-radius:34px;padding:7px;box-shadow:0 22px 40px -22px rgba(20,20,60,.45)}
.phone img{display:block;width:100%;height:auto;border-radius:28px}
figcaption b{display:block;font-size:15px;letter-spacing:-.01em}
figcaption span{display:block;color:var(--muted);font-size:13.5px;line-height:1.45}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Screens from the app</h1>
      <p>Captured from the running Expo build in a phone-sized browser window, against the real API with sample farm data. The same screens build for iOS and Android.</p>
    </div>
    <span class="chip">Expo · React Native · Claude vision</span>
  </header>
  <div class="grid">
    <figure>
      <div class="phone"><img src="shots/farm.jpg" alt="Dashboard with goat, cow and chicken counts and a ranked Needs attention list" width="600" height="1306" loading="lazy"></div>
      <figcaption><b>My Farm</b><span>Head counts, then everything that needs attention, ranked overdue, warning and due. Income, spending and balances below.</span></figcaption>
    </figure>
    <figure>
      <div class="phone"><img src="shots/animals.jpg" alt="Animals list with species filters, Raja marked sick at the top, and flocks shown with head counts" width="600" height="1306" loading="lazy"></div>
      <figcaption><b>Animals and flocks</b><span>Single animals and whole flocks in one list. Sick animals sort to the top.</span></figcaption>
    </figure>
    <figure>
      <div class="phone"><img src="shots/animal.jpg" alt="Raja the goat: sick status, overdue PPR vaccination, vet visit in the health log" width="600" height="1306" loading="lazy"></div>
      <figcaption><b>One animal</b><span>Status, vaccinations for the animal or its species, the health log, and an AI check from a photo.</span></figcaption>
    </figure>
    <figure>
      <div class="phone"><img src="shots/money.jpg" alt="Money screen with October transactions and monthly totals" width="600" height="1306" loading="lazy"></div>
      <figcaption><b>Money</b><span>Income and expenditure by month and category, each tied to a bank or cash account.</span></figcaption>
    </figure>
    <figure>
      <div class="phone"><img src="shots/stock.jpg" alt="Stock screen: layer mash low at about 3 days left" width="600" height="1306" loading="lazy"></div>
      <figcaption><b>Feed and farm goods</b><span>Stock shown as days left at the current rate of use, with quick Used and Restocked buttons.</span></figcaption>
    </figure>
    <figure>
      <div class="phone"><img src="shots/check.jpg" alt="AI health check screen with animal chips, a notes field and photo buttons" width="600" height="1306" loading="lazy"></div>
      <figcaption><b>AI health check</b><span>Pick the animal, describe what you noticed, then take or choose a photo for Claude to screen.</span></figcaption>
    </figure>
  </div>
</div>
</body>
</html>
