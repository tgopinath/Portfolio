<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm Manager Screens</title>
<style>
:root{--bg:#F6F7FB;--ink:#15161F;--muted:#6B6F80;--line:#E3E6F0;--accent:#3046C5;--frame:#0B0B10}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0C0D12;--ink:#ECEDF3;--muted:#9A9DAE;--line:#2A2C38;--accent:#8C9BFF;--frame:#2A2A36}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0C0D12;--ink:#ECEDF3;--muted:#9A9DAE;--line:#2A2C38;--accent:#8C9BFF;--frame:#2A2A36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;padding:32px 16px 48px}
.wrap{max-width:1080px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.chip{font-size:12px;font-weight:600;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 24px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
figure{margin:0;display:flex;flex-direction:column;gap:12px}
.phone{background:var(--frame);border-radius:34px;padding:7px;box-shadow:0 22px 40px -22px rgba(20,20,60,.45)}
.phone img{display:block;width:100%;height:auto;border-radius:28px}
figcaption b{display:block;font-size:15px;letter-spacing:-.01em}
figcaption span{display:block;color:var(--muted);font-size:13.5px;line-height:1.45}
.web{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 24px;margin-top:56px}
@media (max-width:900px){.web{grid-template-columns:1fr}}
.desk{border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 22px 40px -24px rgba(20,20,60,.4)}
.desk img{display:block;width:100%;height:auto}
h2{font-size:20px;letter-spacing:-.01em;margin:56px 0 18px}
</style>
</head>
<body>
<div class="wrap">
  <header style="margin-bottom:0">
    <div>
      <h1>Screens from the app, on a phone and on a laptop</h1>
      <p>Captured from the running Expo build with the sample farm, at phone size and at laptop size. The same code builds the iPhone, Android and web apps.</p>
    </div>
    <span class="chip">Expo · React Native · Claude vision</span>
  </header>
  <h2>On a phone</h2>
  <div class="grid">
    <figure>
      <div class="phone"><img src="shots/farm.jpg" alt="Dashboard with goat, cow and chicken counts and a ranked Needs attention list" width="600" height="1306" loading="lazy"></div>
      <figcaption><b>Today</b><span>Head counts by species, then everything that needs attention, each with the button that settles it. Income, spending and balances below.</span></figcaption>
    </figure>
    <figure>
      <div class="phone"><img src="shots/animals.jpg" alt="Animals list with species filters, Raja marked sick at the top, and flocks shown with head counts" width="600" height="1306" loading="lazy"></div>
      <figcaption><b>Animals and flocks</b><span>Single animals and whole flocks in one list, with search and species filters that show their counts. Sick animals sort to the top.</span></figcaption>
    </figure>
    <figure>
      <div class="phone"><img src="shots/animal.jpg" alt="Raja the goat: sick status, overdue PPR vaccination, vet visit in the health log" width="600" height="1306" loading="lazy"></div>
      <figcaption><b>One animal</b><span>Status, vaccinations for the animal or its species, the health log, and an AI check from a photo.</span></figcaption>
    </figure>
    <figure>
      <div class="phone"><img src="shots/money.jpg" alt="Money screen with October transactions and monthly totals" width="600" height="1306" loading="lazy"></div>
      <figcaption><b>Money</b><span>Six months of income against spending. Tap a month to see its transactions, each tied to a bank or cash account.</span></figcaption>
    </figure>
    <figure>
      <div class="phone"><img src="shots/stock.jpg" alt="Stock screen: layer mash low at about 3 days left" width="600" height="1306" loading="lazy"></div>
      <figcaption><b>Feed and farm goods</b><span>Stock shown as days left at the current rate of use. One tap logs today's feed, with Undo.</span></figcaption>
    </figure>
    <figure>
      <div class="phone"><img src="shots/check.jpg" alt="AI health check screen with animal chips, a notes field and photo buttons" width="600" height="1306" loading="lazy"></div>
      <figcaption><b>AI health check</b><span>Pick the animal, describe what you noticed, then take or choose a photo for Claude to screen.</span></figcaption>
    </figure>
  </div>
  <h2>On a laptop</h2>
  <div class="web" style="margin-top:0">
    <figure>
      <div class="desk"><img src="shots/web-today.jpg" alt="Today in the web app at laptop size" width="1440" height="900" loading="lazy"></div>
      <figcaption><b>Today</b><span>Tasks with their own buttons on the left; head counts, money and accounts on the right.</span></figcaption>
    </figure>
    <figure>
      <div class="desk"><img src="shots/web-animals.jpg" alt="Animals in the web app at laptop size" width="1440" height="900" loading="lazy"></div>
      <figcaption><b>Animals</b><span>Search, species filters with counts, and cards two across.</span></figcaption>
    </figure>
    <figure>
      <div class="desk"><img src="shots/web-animal.jpg" alt="An animal's page in the web app at laptop size" width="1440" height="900" loading="lazy"></div>
      <figcaption><b>An animal's page</b><span>The sidebar stays; vaccinations and the health log sit side by side.</span></figcaption>
    </figure>
    <figure>
      <div class="desk"><img src="shots/web-money.jpg" alt="Money in the web app at laptop size" width="1440" height="900" loading="lazy"></div>
      <figcaption><b>Money</b><span>The six-month chart filters the transactions; accounts and spending by category alongside.</span></figcaption>
    </figure>
    <figure>
      <div class="desk"><img src="shots/web-stock.jpg" alt="Stock in the web app at laptop size" width="1440" height="900" loading="lazy"></div>
      <figcaption><b>Stock</b><span>Feed and goods three across, each with days left and a one-tap log.</span></figcaption>
    </figure>
  </div>
</div>
</body>
</html>
