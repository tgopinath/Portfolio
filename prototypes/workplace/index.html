<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workplace Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F4F8; --card:#FFFFFF; --raise:#FFFFFF; --line:#E6E9F0; --line2:#EEF0F5;
  --text:#1E2330; --muted:#636A7A; --faint:#9AA1B0;
  --accent:#2F78F0; --accent-soft:#E8F0FE; --green:#33B36B; --red:#E5484D;
  --p-blue:#EAF0FD; --p-pink:#FCEBEC; --p-green:#E8F6EE; --p-yellow:#FDF6E3;
  --p-lav:#EDEAFB; --p-lime:#EDF8E2; --p-peach:#FBF0DE; --p-mint:#E2F5F1; --p-rose:#FBE7F1;
  --field:#F6F7FA; --shadow:0 1px 2px rgba(20,30,60,.04),0 6px 24px -12px rgba(20,30,60,.10);
  --thumb:#FFFFFF;
  font-family:"Zoho Puvi","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111318; --card:#1A1D24; --raise:#22262F; --line:#2A2F3A; --line2:#242832;
    --text:#E9EBF1; --muted:#A2A8B6; --faint:#6F7686;
    --accent:#5B96F7; --accent-soft:#1F2B44;
    --p-blue:#1D2840; --p-pink:#36222A; --p-green:#1B3127; --p-yellow:#352E1B;
    --p-lav:#28243E; --p-lime:#25321C; --p-peach:#372B1C; --p-mint:#183331; --p-rose:#382033;
    --field:#20242C; --shadow:0 1px 2px rgba(0,0,0,.3); --thumb:#2A2F3A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111318; --card:#1A1D24; --raise:#22262F; --line:#2A2F3A; --line2:#242832;
  --text:#E9EBF1; --muted:#A2A8B6; --faint:#6F7686;
  --accent:#5B96F7; --accent-soft:#1F2B44;
  --p-blue:#1D2840; --p-pink:#36222A; --p-green:#1B3127; --p-yellow:#352E1B;
  --p-lav:#28243E; --p-lime:#25321C; --p-peach:#372B1C; --p-mint:#183331; --p-rose:#382033;
  --field:#20242C; --shadow:0 1px 2px rgba(0,0,0,.3); --thumb:#2A2F3A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{flex:none}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:0 20px;height:46px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.home{position:relative;height:46px;display:grid;place-items:center;padding:0 6px;color:var(--muted)}
.home.on{color:var(--accent)}
.home.on::after{content:"";position:absolute;left:4px;right:4px;bottom:0;height:2px;border-radius:2px;background:var(--accent)}
.apps{display:flex;align-items:center;gap:10px;flex:1;min-width:0;overflow:hidden;justify-content:center}
.apps button{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;color:var(--text);white-space:nowrap;font-size:14.5px}
.apps .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.apps .more{color:var(--muted);padding:6px}
.apps button:hover{background:var(--field)}
.apps svg{color:var(--muted)}
.tools{display:flex;align-items:center;gap:14px;color:var(--muted)}
.tools button{display:grid;place-items:center;width:32px;height:32px;border-radius:8px}
.tools button:hover{background:var(--field);color:var(--text)}
.self{width:30px;height:30px;border-radius:50%;position:relative}
.self::after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--card)}

.wrap{padding:20px 20px 72px;max-width:1480px;margin:0 auto}
.menu.gmenu{position:fixed;width:220px;top:calc(env(safe-area-inset-top,0px) + 50px);right:16px;left:auto}
.gmenu .mh{white-space:nowrap}

/* ---------- grid ---------- */
.board{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:22px;align-items:start}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}

/* ---------- widget ---------- */
.w.anim{overflow:hidden}
.w:has(.menu){z-index:15}
.w{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);transition:height .32s cubic-bezier(.2,.8,.2,1),border-color .2s}
.w.flash{border-color:var(--accent)}
.wh{display:flex;align-items:center;gap:10px;padding:16px 18px 6px 18px;position:relative}
.wh .ic{color:var(--accent);display:grid;place-items:center}
.wh h2{margin:0;font-size:16.5px;font-weight:500;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;color:var(--muted)}
.dd:hover{background:var(--field)}
.sz{margin-left:auto;display:flex;align-items:center;gap:2px;padding:3px;border-radius:10px;background:var(--field);border:1px solid var(--line2)}
@media (hover:hover){
  .sz{opacity:0;transform:translateY(-2px);transition:opacity .15s,transform .15s;pointer-events:none}
  .w:hover .sz,.w:focus-within .sz{opacity:1;transform:none;pointer-events:auto}
}
.sz button{position:relative;display:grid;place-items:center;width:30px;height:26px;border-radius:7px;color:var(--faint)}
.sz button:hover{color:var(--muted)}
.sz button[aria-pressed="true"]{background:var(--raise);color:var(--accent);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.sz button[aria-pressed="true"].auto::before{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--green)}
.sz button::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;white-space:nowrap;background:#1E2330;color:#fff;font-size:12px;font-weight:500;padding:5px 9px;border-radius:7px;opacity:0;transform:translateY(-3px);pointer-events:none;transition:.12s;z-index:25}
.sz button:hover::after,.sz button:focus-visible::after{opacity:1;transform:none;transition-delay:.25s}
.wb{padding:10px 18px 20px}
.menu{position:absolute;top:44px;left:44px;z-index:20;min-width:210px;background:var(--raise);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px -10px rgba(10,20,50,.25);padding:6px}
.menu .mh{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:8px 10px 4px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px}
.menu button:hover{background:var(--field)}
.menu button .d{margin-left:auto;font-size:12px;color:var(--faint)}
.menu button.cur{color:var(--accent);font-weight:600}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}

/* ---------- shared bits ---------- */
.av{position:relative;overflow:hidden;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;flex:none;letter-spacing:.02em}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.self{overflow:visible!important}.self img{border-radius:50%}
.av.sm{width:30px;height:30px;font-size:11px}
.av.xs{width:22px;height:22px;font-size:9px;border:2px solid var(--card)}
.av.lg{width:62px;height:62px;border-radius:16px;font-size:20px}
.sec{font-size:14px;font-weight:600;color:var(--text);margin:6px 0 10px}
.sec.blue{color:var(--accent)} .sec.green{color:var(--green)}
.divider{border:0;border-top:1px dashed var(--line);margin:16px 0}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.row{display:flex;align-items:center;gap:12px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:12px;cursor:pointer}
.li:hover{background:var(--field)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .when{font-size:12px;color:var(--faint);align-self:flex-start;margin-top:3px}
.drop{border:1.5px dashed var(--line);border-radius:16px;padding:20px;display:grid;place-items:center;gap:6px;color:var(--faint);font-size:13px;text-align:center;transition:.2s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.field{display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:0 6px 0 14px;height:44px}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:0;height:100%}
.field input::placeholder,textarea::placeholder{color:var(--faint)}
.btn{background:var(--accent);color:#fff;border-radius:9px;padding:0 14px;height:34px;font-weight:600;font-size:13px;letter-spacing:.03em}
.btn:hover{filter:brightness(1.07)}
.link{color:var(--accent);font-weight:500}
.empty{color:var(--faint);font-size:13px;padding:10px 0;text-align:center}

/* chats */
.pins{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pin{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding:6px 0;border-radius:14px}
.pin:hover{background:var(--field)}
.pin .ph{position:relative}
.pin .badge{position:absolute;top:-6px;right:-8px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--card)}
.pin small{font-size:13.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.convo{position:relative;border:1px solid var(--line);border-radius:16px;margin:4px 4px 10px 0}
.convo .bar{border-radius:15px 15px 0 0}
.xclose{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:#E5484D;color:#fff;display:grid;place-items:center;border:2px solid var(--card)}
.xclose svg{width:10px;height:10px}
.convo .bar{display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;padding:10px 12px}
.convo .bar b{display:block;font-weight:600;font-size:14px}
.convo .bar span{display:block;font-size:12px;opacity:.85}
.convo .bar button{color:#fff;display:grid;place-items:center;width:30px;height:30px;border-radius:8px}
.convo .bar button:hover{background:rgba(255,255,255,.15)}
.msgs{padding:12px;display:flex;flex-direction:column;gap:10px;max-height:240px;overflow:auto}
.m{max-width:80%}
.m p{margin:0;padding:6px 12px;border-radius:14px;background:var(--field);display:inline-block}
.m small{display:block;font-size:11px;color:var(--faint);margin-top:3px}
.m.me{align-self:flex-end;text-align:right}
.m.me p{background:var(--accent-soft)}
.m.them{display:flex;gap:8px;align-items:flex-start}
.compose{display:flex;align-items:center;gap:8px;margin:0 12px 12px;border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;height:38px}
.compose input{flex:1;min-width:0;border:0;outline:0;background:transparent}
.compose button{color:var(--accent);display:grid;place-items:center;width:28px;height:28px;border-radius:50%}

/* notes */
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.note{position:relative;border-radius:16px;padding:14px 16px 16px;clip-path:polygon(0 0,calc(100% - 30px) 0,100% 30px,100% 100%,0 100%)}
.note::after{content:"";position:absolute;top:0;right:0;width:30px;height:30px;background:linear-gradient(225deg,transparent 50%,rgba(20,30,60,.12) 50%);border-bottom-left-radius:6px}
.note h3{margin:0 0 6px;font-size:15px;font-weight:600}
.note ol{margin:0;padding-left:18px;font-size:14px;line-height:1.3}
.note li.done{text-decoration:line-through;color:var(--faint)}
.note li{cursor:pointer}
.editor{border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.editor .tb{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line2);color:var(--muted);flex-wrap:wrap}
.editor .tb span{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;font-size:12px;font-weight:700}
.editor input,.editor textarea{display:block;width:100%;border:0;outline:0;background:transparent;padding:10px 16px 0;resize:none}
.editor input{font-weight:600;font-size:15px}
.editor textarea{padding-bottom:6px;min-height:58px}
.editor .ft{display:flex;justify-content:flex-end;padding:0 10px 10px}

/* files */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;min-width:0}
.tile:hover .th{transform:translateY(-2px);box-shadow:0 8px 18px -10px rgba(20,30,60,.35)}
.tile small{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.th{width:100%;max-width:120px;aspect-ratio:1.05;border-radius:16px;display:grid;place-items:center;transition:.2s;overflow:hidden;position:relative}
.th.doc{background:var(--thumb);border:1px solid var(--line);padding:9px;display:flex;flex-direction:column;gap:4px;align-items:stretch}
.th.doc i{display:block;height:4px;border-radius:2px;background:var(--line)}
.th.doc i.h{height:9px;background:#2B3A67;width:70%}
.th.doc i.img{height:22px;background:linear-gradient(90deg,#3B6B8F,#7AA6A1)}
.th.doc i.acc{background:#9B3A6C;height:14px;width:45%;margin-left:auto}
.th.sheet{background:var(--thumb);border:1px solid var(--line);padding:6px;display:grid;grid-template-columns:1fr 2fr 1.3fr;gap:2px;align-content:start;place-items:stretch}
.th.sheet i{display:block;height:6px;background:var(--line2)}
.th.slide{border:1px solid var(--line)}
.ficon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none}

/* events */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:10px;color:var(--faint);font-size:13px;position:relative;background:var(--field)}
.day b{font-weight:600;color:var(--muted);font-size:14px}
.day.has::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.day.on{background:var(--p-yellow);color:var(--text)}
.day.on b{color:var(--text)}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl .dlab{text-align:center;font-size:12.5px;color:var(--faint);margin:6px 0 8px}
.ev{position:relative;border-radius:16px;padding:12px 16px;margin-bottom:12px}
.ev::before{content:"";position:absolute;left:-21px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--dot)}
.ev h4{margin:0;font-size:15px;font-weight:500}
.ev p{margin:3px 0 0;font-size:14px;color:var(--muted)}
.ev .desc{font-size:13px;margin-top:8px;color:var(--muted)}
.ev .att{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--muted)}
.ev .att .stack{display:flex}
.ev .att .stack .av{margin-left:-6px}
.today{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.today .ev{margin:0;padding:14px 16px}
.today .ev::before{display:none}
.evform{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-bottom:10px}
.evform input{border:1px solid var(--line);background:var(--field);border-radius:10px;height:36px;padding:0 10px;min-width:0}

/* feeds */
.post{display:flex;gap:12px;padding:12px 0}
.post .t{flex:1;min-width:0}
.post .who{font-size:14px;line-height:1.5}
.post .who b{font-weight:600}
.post time{display:block;font-size:12px;color:var(--faint);margin:4px 0}
.post .body{margin:8px 0;font-size:14px}
.post .tags{color:var(--accent);font-size:14px}
.acts{display:flex;gap:14px;color:var(--faint);font-size:12px}
.acts button{display:flex;align-items:center;gap:4px;color:var(--faint)}
.acts button.on{color:var(--red)}

/* tasks */
.task{border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 16px;display:grid;grid-template-columns:20px 1fr auto;gap:4px 10px;margin-bottom:12px;position:relative;overflow:hidden}
.task::after{content:"";position:absolute;inset:auto 0 0 0;height:40px;background:linear-gradient(170deg,transparent 55%,var(--tint) 56%);pointer-events:none;opacity:.8}
.task .k{color:var(--muted);padding-top:2px}
.task b{font-weight:500;font-size:15px}
.task .path{grid-column:2;font-size:13.5px;color:var(--muted)}
.task .due{grid-column:2;font-size:13.5px;color:var(--muted);margin-top:8px}
.task .chk{grid-row:1;grid-column:3;width:28px;height:28px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;color:transparent}
.task .chk:hover{border-color:var(--green);color:var(--green)}
.task.closed .chk{background:var(--p-green);border-color:transparent;color:var(--green)}
.task.closed b{color:var(--muted)}
.task .who{grid-column:3;grid-row:2/4;align-self:end;z-index:1}
.task.mini{grid-template-columns:20px 1fr auto;padding:10px 12px;margin-bottom:8px}
.task.mini::after{display:none}
.shead{display:flex;align-items:center;justify-content:space-between}
.shead button{color:var(--faint);display:grid;place-items:center;width:26px;height:26px;border-radius:50%}
.shead button:hover{color:var(--accent);background:var(--field)}

/* reminders */
.rem{background:var(--field);border-radius:16px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.rem .t{flex:1;min-width:0}
.rem b{font-weight:500;font-size:15px;display:block}
.rem span{color:var(--accent);font-size:13.5px}
.rem button{color:var(--faint);opacity:0;transition:.15s;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.rem:hover button,.rem button:focus-visible{opacity:1}
.rem button:hover{color:var(--green);background:var(--card)}
.when-sel{border:0;background:transparent;color:var(--accent);font-weight:500;margin:8px 0 12px;padding:0;cursor:pointer}

/* bookmarks */
.bms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bm{border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s;display:block;color:inherit;text-decoration:none}
.bm:hover{transform:translateY(-2px);box-shadow:0 10px 22px -14px rgba(20,30,60,.4)}
.bm .hero{aspect-ratio:1.55;display:grid;place-items:center;color:rgba(255,255,255,.92);font-weight:600;font-size:15px;position:relative;overflow:hidden}
.bm .hero::before{content:"";position:absolute;width:130%;height:80%;left:-10%;top:45%;border-radius:50%;background:rgba(255,255,255,.18)}
.bm .hero span{position:relative}
.bm .meta{padding:10px 14px 12px}
.bm .meta b{display:block;font-weight:500;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bm .meta small{color:var(--muted);font-size:12.5px}

/* bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:stretch;height:44px;padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .tabs{display:flex;border-right:1px solid var(--line)}
.dock .tabs button{width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;color:var(--muted)}
.dock .tabs button:hover{color:var(--accent)}
.dock .smart{flex:1;display:flex;align-items:center;padding:0 14px;min-width:0}
.dock .smart input{flex:1;border:0;outline:0;background:transparent;min-width:0}
.dock .end{display:flex;border-left:1px solid var(--line)}
.dock .end button{width:44px;display:grid;place-items:center;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:62px;transform:translate(-50%,20px);opacity:0;background:#1E2330;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;transition:.25s;z-index:50;pointer-events:none;max-width:calc(100% - 32px)}

/* "Fit to content": choose the variant the current content needs */
function fitSize(id){
  const open = S.tasks.filter(t=>!t.done).length, closed = S.tasks.length-open;
  const unread = S.chats.filter(c=>c.unread>0).length;
  switch(id){
    case 'chats': return unread>=4 ? 'S' : S.chats.length>4 ? 'M' : 'L';
    case 'events': { const n = S.events.filter(e=>e.day===S.today).length; return n===0?'S': n<=2 && S.events.length<=2 ? 'S' : S.events.length>3 ? 'L':'M'; }
    case 'notes': return S.notes.length<=2 ? 'S' : 'M';
    case 'feeds': return S.posts.length>4 ? 'L' : 'M';
    case 'tasks': return closed>0 ? 'L' : open>2 ? 'M' : 'S';
    case 'reminders': return S.reminders.length===0 ? 'M' : S.reminders.length>3 ? 'L' : 'M';
    case 'bookmarks': return S.bookmarks.length>2 ? 'L' : 'S';
    default: { const f = S.files[id]; return f.list.length>3 && f.fav.length ? 'L' : f.list.length ? 'M' : 'S'; }
  }
}
const sizeOf = id => fitMode[id] ? fitSize(id) : sizes[id];

/* ================= mount ================= */
const board = document.getElementById('board');
let cols = 0;
function layout(){
  const w = board.clientWidth;
  const n = w > 1060 ? 3 : w > 680 ? 2 : 1;
  if(n===cols) return; cols = n;
  board.style.setProperty('--cols',n);
  board.innerHTML = '';
  const c = Array.from({length:n},()=>{const d=document.createElement('div');d.className='col';board.appendChild(d);return d;});
  if(n===3) WIDGETS.forEach(w=>c[w.col].appendChild(shell(w)));
  else {
    // keep reading order: interleave designed columns row by row, then balance
    const order = []; for(let r=0;r<4;r++) for(let k=0;k<3;k++){const w=WIDGETS.filter(x=>x.col===k)[r]; if(w) order.push(w);}
    order.forEach((w,i)=>c[i%n].appendChild(shell(w)));
  }
  WIDGETS.forEach(w=>paint(w.id,false));
}
function shell(w){
  const el = document.createElement('section');
  el.className='w'; el.id='w-'+w.id; el.setAttribute('aria-labelledby','h-'+w.id);
  return el;
}
function header(w){
  const sz = sizeOf(w.id), fit = !!fitMode[w.id];
  const title = w.id==='chats' ? chatFilter().label : w.title;
  return `<div class="wh"><span class="ic" style="color:${w.color||'var(--accent)'}">${I[w.icon]}</span><h2 id="h-${w.id}">${esc(title)}</h2><button class="dd" data-act="menu" data-w="${w.id}" aria-label="${esc(title)} options" aria-haspopup="menu">${I.chev}</button>
    <div class="sz" role="group" aria-label="Widget size">${['S','M','L'].map(s=>{const on=sz===s;const tip=(fit&&on?'Fit to content · ':'')+w.v[s];return `<button class="${fit&&on?'auto':''}" data-act="set" data-w="${w.id}" data-size="${s}" aria-pressed="${on}" aria-label="${tip}" data-tip="${tip}">${I[s]}</button>`}).join('')}</div></div>`;
}
function paint(id, animate=true){
  const w = WIDGETS.find(x=>x.id===id), el = document.getElementById('w-'+id);
  if(!el) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const h0 = el.offsetHeight;
  el.innerHTML = header(w) + `<div class="wb">${R[id](sizeOf(id))}</div>`;
  if(id==='chats'){ const m=document.getElementById('msgs'); if(m) m.scrollTop=m.scrollHeight; }
  if(!animate || reduce || !h0) return;
  const h1 = el.offsetHeight;
  if(h0===h1) return;
  el.classList.add('anim'); el.style.height = h0+'px'; el.offsetHeight; el.style.height = h1+'px';
  const done = () => { el.style.height=''; el.classList.remove('anim'); el.removeEventListener('transitionend',done); };
  el.addEventListener('transitionend',done); setTimeout(done,450);
}
function summary(){
  const u = S.chats.reduce((a,c)=>a+c.unread,0), ev = S.events.filter(e=>e.day===S.today).length, t = S.tasks.filter(t=>!t.done).length;
  const sl=document.getElementById('sumline'); if(sl) sl.textContent = `Wednesday, Nov 11 · ${u} unread messages · ${ev} events today · ${t} open tasks`;
}
const repaintFits = () => WIDGETS.forEach(w=>{ if(fitMode[w.id]) paint(w.id); });

/* ================= interactions ================= */
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2000); }
function setSize(id,s){
  if(s==='fit'){ fitMode[id]=!fitMode[id]; if(!fitMode[id]) sizes[id]=fitSize(id); }
  else { fitMode[id]=false; sizes[id]=s; }
  save(); paint(id);
}
function closeMenu(){ document.querySelectorAll('.menu').forEach(m=>m.remove()); }
function openMenu(id, btn){
  closeMenu();
  const m = document.createElement('div'); m.className='menu'; m.setAttribute('role','menu');
  m.innerHTML = id==='chats'
    ? `<div class="mh">Show</div>${CHAT_FILTERS.map(f=>{const n=S.chats.filter(f.test).length;return `<button role="menuitemradio" aria-checked="${f.id===S.chatFilter}" class="${f.id===S.chatFilter?'cur':''}" data-act="chat-filter" data-f="${f.id}">${f.label}<span class="d">${n}</span></button>`}).join('')}`
    : `<button role="menuitem" data-act="refresh" data-w="${id}">Refresh</button>`;
  btn.closest('.wh').appendChild(m);
  m.querySelector('button').focus();
}
function flash(id){ const el=document.getElementById('w-'+id); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),500); }

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(!e.target.closest('.menu') && !(b && (b.dataset.act==='menu'||b.dataset.act==='gmenu'))) closeMenu();
  if(!b) return;
  const a = b.dataset.act, d = b.dataset;
  switch(a){
    case 'set': closeMenu(); setSize(d.w,d.size); break;
    case 'menu': { const open = b.parentElement.querySelector('.menu'); if(open) closeMenu(); else openMenu(d.w,b); break; }
    case 'chat-filter':
      closeMenu(); S.chatFilter=d.f; try{ localStorage.setItem('wp-chatfilter',d.f); }catch(_){}
      paint('chats'); break;
    case 'refresh': closeMenu(); paint(d.w); flash(d.w); toast('Refreshed'); break;
    case 'all': closeMenu();
      WIDGETS.forEach(w=>{ if(d.size==='fit'){ fitMode[w.id]=true; } else { fitMode[w.id]=false; sizes[w.id]=d.size; } });
      save(); WIDGETS.forEach(w=>paint(w.id));
      toast(d.size==='fit'?'Every widget now sizes itself to its content':d.size==='S'?'All widgets compact':d.size==='M'?'All widgets standard':'All widgets expanded'); break;
    case 'gmenu': {
      if(document.querySelector('.gmenu')){ closeMenu(); break; }
      closeMenu(); const m=document.createElement('div'); m.className='menu gmenu'; m.setAttribute('role','menu');
      m.innerHTML=`<div class="mh">All widgets</div><button role="menuitem" data-act="all" data-size="S">${I.S} Compact</button><button role="menuitem" data-act="all" data-size="M">${I.M} Standard</button><button role="menuitem" data-act="all" data-size="L">${I.L} Expanded</button><hr><button role="menuitem" data-act="all" data-size="fit">${I.fit} Fit to content</button>`;
      document.body.appendChild(m); m.querySelector('button').focus(); break; }
    case 'toast': toast(d.msg); break;
    case 'theme': {
      const r=document.documentElement, dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      r.dataset.theme = dark?'light':'dark'; break; }
    case 'focus-smart': document.getElementById('smart').focus(); break;
    case 'open-chat': {
      const i=+d.i; S.activeChat=i; S.chats[i].unread=0;
      fitMode.chats=false; sizes.chats='L'; save(); paint('chats'); summary(); repaintFits();
      setTimeout(()=>document.getElementById('chatIn')?.focus({preventScroll:true}),50); break; }
    case 'close-chat': sizes.chats='M'; fitMode.chats=false; save(); paint('chats'); break;
    case 'day': S.selDay=+d.d; paint('events'); break;
    case 'ev-form': S.evForm=true; paint('events'); setTimeout(()=>document.getElementById('evTitle')?.focus(),30); break;
    case 'note-item': { const n=S.notes[+d.n], j=+d.j; n.done = n.done.includes(j)? n.done.filter(x=>x!==j) : [...n.done,j]; b.classList.toggle('done'); break; }
    case 'like': { const p=S.posts[+d.i]; p.liked=!p.liked; p.l+=p.liked?1:-1; paint('feeds',false); break; }
    case 'task': {
      const t=S.tasks[+d.i]; t.done=!t.done; t.tint=t.done?'--p-green':'--p-blue';
      toast(t.done?`Closed “${t.t}”`:`Reopened “${t.t}”`); paint('tasks'); summary(); break; }
    case 'add-task': {
      const n = S.tasks.filter(t=>!t.done).length+1;
      S.tasks.unshift({t:'New task '+n,path:'Workplace > Inbox',due:'Nov 20,2020',who:'Gopinath T',done:false,tint:'--p-blue'});
      paint('tasks'); summary(); toast('Task added'); break; }
    case 'rem-done': { const r=S.reminders.splice(+d.i,1)[0]; toast(`Done: ${r.t}`); paint('reminders'); break; }
    case 'open-file': toast(`Opening “${d.n}”…`); break;
    case 'upload': pick(d.k); break;
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeMenu();
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[tabindex="0"][data-act]')){ e.preventDefault(); e.target.click(); }
  if(e.ctrlKey && e.code==='Space'){ e.preventDefault(); document.getElementById('smart').focus(); }
});
document.addEventListener('change', e=>{ if(e.target.id==='remWhen') S.remWhen=e.target.value; });

document.addEventListener('submit', e=>{
  e.preventDefault();
  const f = e.target.dataset.form;
  if(f==='chat'){
    const v = document.getElementById('chatIn').value.trim(); if(!v) return;
    const c = S.chats[S.activeChat]; const now = new Date();
    c.msgs.push({me:true,t:v,at:now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}).toLowerCase()+', Nov 11'});
    paint('chats',false); document.getElementById('chatIn').focus({preventScroll:true});
    setTimeout(()=>{ c.msgs.push({me:false,t:['Sure, will check 👍','Got it, thanks!','On it.'][c.msgs.length%3],at:'just now'}); if(S.activeChat===S.chats.indexOf(c) && sizeOf('chats')==='L'){ const had=document.activeElement?.id==='chatIn'; paint('chats',false); if(had) document.getElementById('chatIn').focus({preventScroll:true}); } },1400);
  }
  if(f==='note'){
    const t = document.getElementById('noteTitle').value.trim(), items = document.getElementById('noteBody').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!t && !items.length){ toast('Add a title or at least one item'); return; }
    S.notes.unshift({title:t||'Untitled',items:items.length?items:['—'],done:[],c:S.noteColors[S.notes.length%S.noteColors.length]});
    paint('notes'); toast('Note saved');
  }
  if(f==='post'){
    const v = document.getElementById('postIn').value.trim(); if(!v) return;
    S.posts.unshift({who:'Gopinath T',group:'Openings',title:v,at:'Just now',c:0,l:0,liked:false});
    paint('feeds'); repaintFits(); toast('Posted to Openings');
  }
  if(f==='rem'){
    const v = document.getElementById('remIn').value.trim(); if(!v){ toast('Give the reminder a title'); return; }
    const w = S.remWhen==='Tomorrow' ? 'Tomorrow at 9.00 AM' : 'in '+S.remWhen;
    S.reminders.unshift({t:v,w}); paint('reminders'); repaintFits(); toast(`Reminder set ${w}`);
    setTimeout(()=>document.getElementById('remIn')?.focus({preventScroll:true}),30);
  }
  if(f==='bm'){
    let v = document.getElementById('bmIn').value.trim(); if(!v) return;
    let host; try{ host = new URL(/^https?:/.test(v)?v:'https://'+v).hostname.replace(/^www\./,''); }catch(_){ toast('That doesn\'t look like a URL — try example.com'); return; }
    S.bookmarks.unshift({title:v,host,g:S.bmPal[S.bookmarks.length%S.bmPal.length]});
    paint('bookmarks'); repaintFits(); toast(`Bookmarked ${host}`);
  }
  if(f==='event'){
    const t = document.getElementById('evTitle').value.trim(), tm = document.getElementById('evTime').value.trim()||'5.00 pm';
    if(!t) return;
    S.events.push({day:S.selDay,title:t,time:tm+' - 1 hr',c:'--p-lav',dot:'#8B6CF0'});
    S.events.sort((a,b)=>a.day-b.day); S.evForm=false; paint('events'); summary(); toast(`Added to Nov ${S.selDay}`);
  }
  if(e.target.id==='smartForm'){ const s=document.getElementById('smart'); if(s.value.trim()) toast(`Searching for “${s.value.trim()}”…`); s.value=''; }
});

/* file upload via picker or drag-drop */
const picker = Object.assign(document.createElement('input'),{type:'file',multiple:true,hidden:true}); document.body.appendChild(picker);
let pickKind = null;
function pick(k){ pickKind=k; picker.value=''; picker.click(); }
function addFiles(k, files){
  if(!files.length) return;
  const f = S.files[k];
  [...files].reverse().forEach(file=>{
    const ext = (file.name.split('.').pop()||'').toLowerCase();
    const x = k==='drive' ? (ext==='pdf'?'pdf':ext==='sketch'?'sketch':/xls|csv/.test(ext)?'sheet':/ppt|key/.test(ext)?'show':'writer') : 'Gopinath T';
    f.list.unshift([file.name,'Uploaded just now by Gopinath T',x]);
  });
  paint(k); repaintFits(); toast(`Uploaded ${files.length} file${files.length>1?'s':''}`);
}
picker.addEventListener('change',()=>addFiles(pickKind,picker.files));
document.addEventListener('dragover',e=>{ const d=e.target.closest('.drop'); if(d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave',e=>{ const d=e.target.closest('.drop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop',e=>{ const d=e.target.closest('.drop'); if(!d) return; e.preventDefault(); d.classList.remove('over'); addFiles(d.dataset.k,e.dataTransfer.files); });

/* top nav */
document.getElementById('apps').innerHTML = Object.keys(appIcon).map(n=>`<button data-act="toast" data-msg="${n} opens in its own tab">${appIcon[n]}<span>${n}</span></button>`).join('') + `<span class="sep"></span><button class="more" aria-label="More apps" data-act="toast" data-msg="More apps">${I.chev}</button>`;
const hr = new Date().getHours();


summary();
layout();
new ResizeObserver(()=>layout()).observe(board);
</script>
</body>
