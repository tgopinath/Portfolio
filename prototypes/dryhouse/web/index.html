    <div class="page-head">
      <span class="eyebrow">Guide</span>
      <h1>How the dry house works</h1>
      <p class="lede">A solar dry house is a closed greenhouse built for drying, not growing. Sunlight passes through the clear roof and heats a black floor, which warms the air. Fans pull that warm air across the trays and push the moisture out. Produce dries faster and stays clean, safe from rain, dust, birds and insects.</p>
    </div>

    <div class="grid-cards">
      <div class="card"><span class="tag">Roof &amp; walls</span><h3>UV-stabilised polycarbonate</h3><p>Usually 4–6 mm multiwall sheet on a GI pipe frame. Lets sunlight in and traps the heat. Lasts 8–10 years before it yellows.</p></div>
      <div class="card"><span class="tag">Floor</span><h3>Black absorber</h3><p>Black-painted concrete or black sheet. It turns sunlight into heat and keeps giving it off after clouds pass.</p></div>
      <div class="card"><span class="tag">Airflow</span><h3>Low inlets, high exhaust</h3><p>Fresh air enters through meshed vents near the floor. DC fans at the top, run by a small solar panel, pull the moist air out.</p></div>
      <div class="card"><span class="tag">Racks</span><h3>Mesh trays on tiers</h3><p>Food-grade stainless steel or HDPE mesh, so air reaches both sides. Two to four tiers multiply the drying area.</p></div>
      <div class="card"><span class="tag">Door</span><h3>Insect-proof entry</h3><p>A tight door with a mesh screen. Keep it shut while drying — an open door dumps the heat in minutes.</p></div>
      <div class="card"><span class="tag">Gauges</span><h3>Thermometer &amp; hygrometer</h3><p>A digital temperature and humidity meter at tray height tells you when to open vents or cover delicate crops.</p></div>
    </div>

    <h2>A drying day</h2>
    <ol class="steps">
      <li><time>6:30 am</time><div><h3>Air out the night moisture</h3><p>Open the vents and run the fans for 20–30 minutes. Wipe off condensation dripping from the roof.</p></div></li>
      <li><time>7:00 am</time><div><h3>Prepare the produce</h3><p>Wash, sort and cut evenly — 5–8 mm slices dry evenly. Blanch, boil or salt where the material page says so. Drain surface water well.</p></div></li>
      <li><time>8:00 am</time><div><h3>Load the trays</h3><p>One even layer. Freshest, wettest batch on the lowest tier where air enters. Never load fresh produce on top of half-dried produce.</p></div></li>
      <li><time>11 am – 3 pm</time><div><h3>Watch the heat</h3><p>If the thermometer at tray height passes the material's limit, open vents or lay shade net on the roof. Close the door every time you enter.</p></div></li>
      <li><time>1:00 pm</time><div><h3>Turn and rotate</h3><p>Turn pieces over once. Swap top and bottom trays so the whole load dries at the same pace.</p></div></li>
      <li><time>5:00 pm</time><div><h3>Close up for the night</h3><p>Shut vents and door to hold the heat and keep humid night air out. Leave produce on the trays.</p></div></li>
      <li><time>Last day</time><div><h3>Test, cool, pack</h3><p>Do the "done" test, cool to room temperature, then pack in airtight, moisture-proof bags with the date.</p></div></li>
    </ol>

    <h2>Care</h2>
    <div class="grid-cards four">
      <div class="card"><h3>Every day</h3><ul><li>Sweep the floor, wipe trays</li><li>Empty the condensate channel</li><li>Check the fans spin</li></ul></div>
      <div class="card"><h3>Every week</h3><ul><li>Wash trays, dry in the sun</li><li>Dust the solar panel</li><li>Check vent mesh for tears</li></ul></div>
      <div class="card"><h3>Every month</h3><ul><li>Wash the roof with plain water and a soft cloth</li><li>Tighten sheet screws, seal gaps</li><li>Check the door seal</li></ul></div>
      <div class="card"><h3>Every year</h3><ul><li>Repaint the floor black</li><li>Treat frame rust</li><li>Replace yellowed sheets or worn fans</li></ul></div>
    </div>

    <h2>When something goes wrong</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>You see</th><th>Likely cause</th><th>Fix</th></tr></thead>
        <tbody>
          <tr><td>Inside air above 65 °C</td><td>Clear summer noon, vents closed</td><td>Open all vents, run fans full, lay 50% shade net on the roof from 11 am to 2 pm.</td></tr>
          <tr><td>Hard skin, wet inside</td><td>Too hot on day one (case hardening)</td><td>Start cooler, slice thinner, raise heat from day two.</td></tr>
          <tr><td>Mould or sour smell</td><td>Overloaded, loaded wet, or humid nights</td><td>Thinner layers, drain well, close up at 5 pm, run fans at dawn.</td></tr>
          <tr><td>Roof drips in the morning</td><td>Night condensation</td><td>Air out at sunrise before touching trays.</td></tr>
          <tr><td>Leaves losing colour</td><td>Too hot, or direct sun on the crop</td><td>Keep under 45 °C; cover the tray with thin cotton cloth.</td></tr>
          <tr><td>Uneven drying</td><td>Air not reaching every tier</td><td>Rotate trays daily, keep inlets clear, leave a gap at the walls.</td></tr>
          <tr><td>Insects inside</td><td>Torn mesh or open door</td><td>Patch mesh, fit a door closer, clear leftovers between batches.</td></tr>
          <tr><td>Very slow drying</td><td>Cloudy days or fans off</td><td>Expected on cloudy days. Check panel and fan wiring. Never add wet produce on top.</td></tr>
        </tbody>
      </table>
    </div>

    <h2>Questions</h2>
    <div class="faq">
      <details><summary>Why can't some materials reach 3% moisture?</summary><p>Every material settles at a lowest moisture set by the air around it — its equilibrium moisture. Inside a sunny dry house that is about 2–3% for leaves, vegetables and spices, but 8–12% for sugary fruit, salted fish and tamarind, because sugar and salt hold on to water. To go lower you need an electric dehydrator or a desiccant.</p></details>
      <details><summary>Should I dry everything to 3%?</summary><p>No. Each material page shows its safe storage moisture — the level where mould and insects stop. Drying far below that costs extra days, weight (which is money when sold by weight), colour and aroma. Powders and long-storage leaves benefit from 3–5%.</p></details>
      <details><summary>How are the forecast dates worked out?</summary><p>Typical drying days are for clear, sunny days. The app reads today's and the next 16 days' sunshine and humidity from Open-Meteo, counts a cloudy or humid day as only part of a drying day, and adds days up until the material is done. Loading after 11 am starts the count tomorrow.</p></details>
      <details><summary>How do I check moisture without a meter?</summary><p>Weigh a sample tray. When it reaches the "dried weight" from the calculator, it's at your target. Otherwise use the "done when" test on each material page.</p></details>
      <details><summary>Does it work on rainy days?</summary><p>Yes, more slowly — diffuse light still warms the house and the crop stays dry. Drying stops at night; keep the house closed.</p></details>
    </div>
    <p class="fine">All figures are typical guide values for greenhouse-type solar dryers in hot, sunny regions. Your house will vary with size, sheet, fans, season and slice thickness — note a few batches and adjust.</p>
