<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar Prototype</title>
<meta name="description" content="Interactive prototype of a calendar web app: month, week, day, year, agenda and calendar views, event creation, recurring events, reminders and search.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%221%22 y=%222%22 width=%2214%22 height=%2213%22 rx=%223%22 fill=%22%233d8ef0%22/%3E%3Crect x=%224%22 y=%227%22 width=%223%22 height=%223%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#2c3745; --rail:#232c38; --side-text:#a9b2bd; --side-on:#fff;
  --blue:#1a7fd1; --blue-d:#156bb3; --link:#1a7fd1; --teal:#1ec8a5;
  --line:#e6e6e6; --line2:#f2f2f2; --text:#2f2f2f; --muted:#8a8a8a; --soft:#f7f7f7;
  --hatch:repeating-linear-gradient(135deg,#fff 0 6px,#f3f3f3 6px 7px);
  --shadow:0 4px 18px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.08);
  --red:#e5484d; --green:#2fb55d; --orange:#f5a623;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--text);font:13px/1.35 Lato,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.app{display:grid;grid-template-columns:46px auto 1fr;grid-template-rows:minmax(0,1fr) 22px;height:100%}
/* rail */
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding-top:8px;color:#c5ccd5;grid-row:1}
.rail .ri{width:46px;height:40px;display:flex;align-items:center;justify-content:center;position:relative}
.rail .ri:hover{color:#fff}
.rail .ri.cal{height:54px;flex-direction:column;gap:3px;font-size:10px;color:#fff;border-left:2px solid var(--teal);background:rgba(255,255,255,.04)}
.rail .ri.cal span.ic{width:20px;height:20px;border-radius:4px;background:#3d8ef0;display:flex;align-items:center;justify-content:center}
.rail .badge{position:absolute;top:6px;right:9px;background:var(--red);color:#fff;font-size:9px;border-radius:8px;min-width:14px;height:14px;line-height:14px;text-align:center;padding:0 3px}
.rail .grow{flex:1}
/* sidebar */
.side{background:var(--dark);width:220px;display:flex;flex-direction:column;color:var(--side-text);overflow:hidden;grid-row:1;transition:width .18s}
.side.collapsed{width:0}
.side .newbtn{margin:8px 12px 8px 14px;height:32px;background:var(--blue);color:#fff;border-radius:2px;font-size:14px;flex:none;white-space:nowrap}
.side .newbtn:hover{background:#1f8ae3}
.side .sec{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 4px 15px;font-size:9.5px;letter-spacing:.3px;color:#4ea3ea;font-weight:700;white-space:nowrap}
.side .sec button{color:#8d97a3;width:14px;height:14px;border:1px solid #6e7884;border-radius:2px;display:flex;align-items:center;justify-content:center}
.side .sec button:hover{color:#fff;border-color:#fff}
.side .cals{overflow:auto;flex:1;min-height:60px}
.side .citem{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 22px;font-size:14px;cursor:pointer;white-space:nowrap;user-select:none}
.side .citem:hover{background:rgba(255,255,255,.05)}
.side .citem.on{color:var(--side-on)}
.side .citem .ck{opacity:0}
.side .citem.on .ck{opacity:1}
.mini{padding:6px 10px 8px;flex:none;width:220px}
.mini .mh{display:flex;align-items:center;justify-content:space-between;color:#e4e8ec;font-size:14px;padding:4px 4px 8px}
.mini .mh button{color:#aab;padding:2px 4px}
.mini .mh button:hover{color:#fff}
.mini .mg7{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:9.5px;row-gap:2px}
.mini .dw{color:#c7ced6;padding-bottom:6px}
.mini .md{height:22px;position:relative;cursor:pointer;color:#dfe4ea;display:flex;align-items:center;justify-content:center}
.mini .md span{width:18px;height:18px;line-height:18px;border-radius:50%;display:block}
.mini .md.o{color:#78828e}
.mini .md:hover span{background:rgba(255,255,255,.12)}
.mini .md.sel span{background:#3d8ef0;color:#fff}
.mini .md.today span{box-shadow:inset 0 0 0 1px var(--teal)}
.mini .dots{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:1px}
.mini .dots i{width:4px;height:4px;border-radius:50%}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;grid-row:1;position:relative}
.topbar{height:34px;background:var(--dark);display:flex;align-items:flex-end;justify-content:space-between;padding-right:10px;flex:none}
.tabs{display:flex;align-items:flex-end;height:100%;padding-left:0}
.tab{position:relative;height:28px;display:flex;align-items:center;gap:6px;padding:0 22px 0 9px;color:#cfd6de;cursor:pointer;margin-right:2px;font-size:14px}
.tab::before{content:"";position:absolute;inset:0 0 0 0;background:rgba(255,255,255,.06);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 100%,0 100%);z-index:0}
.tab.on{color:#222}
.tab.on::before{background:#fff}
.tab > *{position:relative;z-index:1}
.tab .ti{width:14px;height:14px;border-radius:3px;background:#3d8ef0;display:flex;align-items:center;justify-content:center}
.tab .tx{width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#999;margin-left:4px}
.tab .tx:hover{background:#eee;color:#333}
.tright{display:flex;align-items:center;gap:6px;height:100%;color:#c3cad3}
.tright button{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:3px}
.tright button:hover,.tright button.act{color:#fff;background:rgba(255,255,255,.08)}
.avatar{width:20px;height:20px;border-radius:3px;background:#d26c3f;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.page{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.toolbar{height:52px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px 0 15px;gap:10px}
.tb-l,.tb-r{display:flex;align-items:center;gap:10px}
.tb-r{justify-content:flex-end}
.vsel{height:28px;border:1px solid #d7d7d7;border-radius:2px;display:flex;align-items:center;gap:10px;padding:0 6px 0 9px;color:#444;min-width:63px;justify-content:space-between;font-size:14px}
.vsel:hover{border-color:#bbb}
.seg{display:flex;border:1px solid #d7d7d7;border-radius:2px;height:28px;overflow:hidden}
.seg button{min-width:26px;padding:0 7px;font-size:14px;color:#666;border-right:1px solid #e6e6e6}
.seg button:last-child{border-right:0}
.seg button.on{background:#e3e3e3;color:#222}
.seg button:hover:not(.on){background:#f5f5f5}
.seg.txt button{padding:0 10px;font-size:14px}
.nav{display:flex;align-items:center;gap:14px}
.nav .arr{color:#999;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.nav .arr:hover{background:#f0f0f0;color:#333}
.nav h1{font-size:15.5px;font-weight:700;margin:0;min-width:170px;text-align:center;color:#222;white-space:nowrap}
.btn{height:30px;padding:0 14px;border-radius:2px;font-size:14px;font-weight:700}
.btn.today{background:var(--teal);color:#fff}
.btn.today:hover{background:#19b594}
.btn.pri{background:var(--blue);color:#fff;font-weight:700}
.btn.pri:hover{background:var(--blue-d)}
.btn.sec{background:#eee;color:#777;font-weight:400}
.btn.sec:hover{background:#e3e3e3}
.btn.newtb{background:#4a90e2;color:#fff;font-weight:400;padding:0 18px}
.ib{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:3px;color:#555;position:relative}
.ib:hover,.ib.act{background:#f0f0f0;color:#111}
.vsep{width:1px;height:18px;background:#e2e2e2}
.datebox{height:28px;background:#f0f0f0;border-radius:2px;padding:0 12px;font-size:14px;color:#555;display:flex;align-items:center;min-width:76px;justify-content:center}
.datebox:hover{background:#e6e6e6}
.content{flex:1;min-height:0;position:relative;overflow:hidden;border-top:1px solid var(--line)}
/* tooltips */
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#222;color:#fff;font-size:11px;font-weight:700;white-space:nowrap;padding:5px 9px;border-radius:2px;pointer-events:none;z-index:50}
/* month grid */
.mg{display:flex;flex-direction:column;height:100%}
.mg-head{display:grid;grid-template-columns:repeat(7,1fr);height:24px;flex:none;border-bottom:1px solid var(--line)}
.mg-head div{font-size:14px;color:#666;padding:6px 10px;letter-spacing:.2px}
.mg-body{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto}
.mg-row{flex:1;display:grid;grid-template-columns:repeat(7,1fr);position:relative;border-bottom:1px solid var(--line);min-height:90px}
.mg.compact .mg-row{min-height:46px;flex:0 0 46px}
.mg-cell{border-right:1px solid var(--line);padding:6px 0 0;position:relative;overflow:hidden;cursor:default}
.mg-cell:nth-child(7){border-right:0}
.mg-cell.other{background:#fafafa}
.mg-cell.next{background:var(--hatch)}
.mg-cell.drop{background:#eef6ff}
.mg-num{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;margin-left:6px;font-size:14px;color:#444;border-radius:12px;cursor:pointer;font-weight:700}
.mg-cell.other .mg-num,.mg-cell.next .mg-num{color:#999;font-weight:400}
.mg-num:hover{background:#eee}
.mg-num.today{background:var(--blue);color:#fff!important}
.mg-num.mlab{color:var(--orange)!important;font-weight:400}
.mg-num.mbadge{background:var(--orange);color:#fff!important;border-radius:1px;height:14px;font-size:9.5px;padding:0 6px}
.mg-num.mbadge.today2{background:var(--blue)}
.mg.compact .mg-num{font-size:9.5px;font-weight:400;min-width:16px;height:16px}
.mg-list{padding:2px 6px 0 14px;display:flex;flex-direction:column;gap:2px}
.chip{display:flex;align-items:center;gap:8px;font-size:14px;line-height:18px;color:#333;padding:2px 4px;border-radius:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{background:#f2f2f2}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.chip .ct{color:#999;font-size:14px}.chip i{flex:none}.chip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip span{overflow:hidden;text-overflow:ellipsis}
.more{font-size:14px;line-height:18px;color:var(--link);padding:2px 4px;cursor:pointer;font-weight:700}
.more:hover{text-decoration:underline}
.bar{position:absolute;height:20px;font-size:14px;line-height:20px;padding:0 8px;border-radius:1px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;z-index:2}
.bar:hover{filter:brightness(.97)}
.cdots{display:flex;gap:2px;padding:2px 0 0 8px}
.cdots i{width:5px;height:5px;border-radius:50%}
/* time grid */
.tg{display:flex;flex-direction:column;height:100%}
.tg-head,.tg-ad{display:flex;flex:none;overflow-y:hidden;scrollbar-gutter:stable}
.tg-gut{width:54px;flex:none}
.tg-heads{flex:1;display:grid}
.tg-dh{text-align:center;padding:8px 0 4px;cursor:pointer;color:#444}
.tg-dh small{display:block;font-size:10px;letter-spacing:.3px;color:#555}
.tg-dh b{font-size:23px;font-weight:400;color:#444;display:inline-block;min-width:36px;line-height:32px}
.tg-dh.today b{color:var(--blue);font-weight:700}
.tg-dh:hover b{color:#000}
.tg-ad{border-bottom:1px solid var(--line)}
.tg-adw{flex:1;position:relative;display:grid;min-height:22px}
.tg-adc{border-left:1px solid var(--line2);cursor:pointer}
.tg-adc:first-child{border-left:0}
.tg-adc:hover{background:#fafcff}
.abar{position:absolute;height:19px;line-height:19px;font-size:11.5px;color:#fff;padding:0 14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:1px;z-index:2}
.abar.cont-r{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%)}
.tg-body{flex:1;overflow-y:scroll;position:relative}
.tg-inner{display:flex;position:relative}
.tg-hours{width:54px;flex:none;position:relative}
.tg-hours div{position:absolute;right:16px;font-size:11px;color:#444;transform:translateY(-15px);white-space:nowrap}
.tg-cols{flex:1;display:grid;position:relative}
.tg-col{position:relative;border-left:1px solid var(--line);cursor:cell;touch-action:none}
.tg-col:first-child{border-left:1px solid var(--line)}
.tev{position:absolute;border-left:3px solid;padding:6px 10px 4px 12px;overflow:hidden;cursor:pointer;font-size:11.5px;color:#333;user-select:none;touch-action:none;border-radius:1px}
.tev b{display:block;font-size:12.5px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tev p{margin:0 0 8px;color:#444;line-height:1.3}
.tev .tt{color:#444}
.tev.short{padding:2px 8px}
.tev.short b{display:inline;margin:0 6px 0 0;font-size:11.5px}
.tev.drag{opacity:.85;box-shadow:var(--shadow);z-index:20;pointer-events:none}
.tev-rs{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.ghost{position:absolute;left:2px;right:2px;background:rgba(26,127,209,.18);border:1px solid var(--blue);border-radius:2px;font-size:11px;padding:3px 6px;color:var(--blue-d);z-index:15;pointer-events:none}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:6;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
/* tilt */
.tl{height:100%;overflow:auto;position:relative}
.tl-in{position:relative}
.tl-head{display:flex;position:sticky;top:0;background:#fff;z-index:5;height:44px;align-items:flex-end;border-bottom:1px solid var(--line)}
.tl-head .c0{width:56px;flex:none;position:sticky;left:0;background:#fff;height:100%}
.tl-head .h{flex:none;font-size:11px;color:#444;padding:0 0 8px 6px;font-weight:700}
.tl-row{display:flex;border-bottom:1px solid var(--line);position:relative}
.tl-day{width:56px;flex:none;text-align:center;padding-top:14px;position:sticky;left:0;background:#fff;z-index:4;border-right:1px solid var(--line);cursor:pointer}
.tl-day small{display:block;font-size:10px;color:#555}
.tl-day b{font-size:17px;font-weight:400}
.tl-day.today b{color:var(--blue);font-weight:700}
.tl-track{position:relative;cursor:cell}
.tl-ev{position:absolute;border-top:3px solid;padding:4px 6px;font-size:11px;overflow:hidden;cursor:pointer;white-space:nowrap;text-overflow:ellipsis}
/* year */
.yr{height:100%;overflow:auto;padding:18px 40px 30px}
.yr-g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 36px;max-width:1100px;margin:0 auto}
.ym h3{text-align:center;font-size:13px;font-weight:400;margin:6px 0 10px;cursor:pointer;color:#333}
.ym h3:hover{color:var(--blue)}
.ym .g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;row-gap:2px}
.ym .w{color:#555;font-size:10px;padding-bottom:5px}
.ym .d{height:20px;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ym .d span{width:20px;height:20px;line-height:20px;border-radius:50%}
.ym .d:hover span{background:#eef3f8}
.ym .d.o{color:#aaa}
.ym .d.today span{background:var(--blue);color:#fff}
.ym .d i{position:absolute;bottom:-3px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%}
/* agenda */
.ag{height:100%;overflow:auto;padding-bottom:30px}
.ag-g{border-bottom:1px solid var(--line)}
.ag-h{padding:14px 15px 10px;font-size:13.5px;font-weight:700;color:#222}
.ag-h small{font-weight:400;color:#777;font-size:11px;margin-left:6px}
.ag-r{display:grid;grid-template-columns:52px 120px 1fr 60px 50px;align-items:center;height:38px;padding:0 0 0 0;cursor:default}
.ag-r:hover{background:#f7f7f7}
.ag-ic{display:flex;align-items:center;gap:5px;justify-content:flex-end;padding-right:6px;color:#666}
.ag-ic .a,.ag-ic .rp{opacity:0;width:14px;height:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ag-r:hover .ag-ic .a,.ag-r:hover .ag-ic .rp,.ag-ic .set{opacity:1!important;color:var(--blue)}
.ag-ic .sq{width:9px;height:9px;border-radius:2px}
.ag-t{font-size:11.5px;color:#444;padding-left:12px}
.ag-n{font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px}
.ag-n:hover{color:var(--blue)}
.ag-st{display:flex;justify-content:center}
.rsvp{width:13px;height:13px;border-radius:2px;color:#fff;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center}
.ag-del{opacity:0;color:#999;display:flex;justify-content:center;border-left:1px solid #e5e5e5;height:14px;align-items:center;cursor:pointer}
.ag-r:hover .ag-del{opacity:1}
.ag-del:hover{color:var(--red)}
.empty{padding:60px 20px;text-align:center;color:#999}
/* calendar cards */
.cv{height:100%;overflow:auto;background:#f6f6f6;padding:12px 24px 30px}
.cv h4{margin:6px 0 12px 6px;font-size:12px;font-weight:400;color:#555}
.cv-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px;align-items:start;margin-bottom:18px}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:2px;padding:14px 14px 16px;min-height:100px}
.card-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;position:relative}
.card-h .nm{font-size:13.5px;flex:1;min-width:0}
.card-h .nm small{display:block;font-size:10.5px;color:#444;margin-top:1px}
.card-h .ul{display:block;width:26px;height:3px;border-radius:2px;margin-top:6px}
.card-h .add{color:#999;opacity:0;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.card:hover .card-h .add{opacity:1}
.card-h .add:hover{color:#333}
.av{width:28px;height:28px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.av.sm{width:16px;height:16px;font-size:8px;border-radius:2px}
.av.md{width:22px;height:22px;font-size:9px}
.tile{padding:10px 12px;margin-bottom:10px;border-radius:2px;cursor:pointer}
.tile b{display:block;font-weight:400;font-size:13px;margin-bottom:4px;color:#222}
.tile span{display:block;font-size:11.5px;color:#555;line-height:1.45}
.tile:hover{filter:brightness(.97)}
.card .none{color:#aaa;font-size:12px;padding:6px 0}
/* popovers */
#layer{position:fixed;inset:0;pointer-events:none;z-index:200}
.pop{position:fixed;background:#fff;box-shadow:var(--shadow);border-radius:2px;pointer-events:auto;min-width:120px;border:1px solid #e4e4e4}
.pop .ph{font-weight:700;font-size:13px;padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:center}
.menu{padding:6px 0}
.menu .mi{display:flex;align-items:center;gap:8px;padding:8px 18px;cursor:pointer;white-space:nowrap;font-size:12.5px}
.menu .mi:hover,.menu .mi.hl{background:var(--blue);color:#fff}
.menu .mi.hl2{background:#4a90e2;color:#fff}
.menu .ms{font-size:9.5px;color:#999;padding:8px 14px 4px;letter-spacing:.3px}
.vgrid{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.vgrid .vr{display:flex;border:1px solid #e3e3e3;border-radius:2px;width:max-content}
.vgrid button{height:24px;padding:0 10px;font-size:12px;border-right:1px solid #e3e3e3;min-width:30px}
.vgrid button:last-child{border-right:0}
.vgrid button:hover{background:#f2f2f2}
.vgrid button.on{background:#4a90e2;color:#fff}
.vgrid button.lbl{padding-right:4px}
.qa{width:320px;padding:0 22px 20px}
.qa .ph{padding:18px 0 10px}
.inp{width:100%;height:32px;border:1px solid #ddd;border-radius:2px;padding:0 12px;outline:none;background:#fff}
.inp:focus{border-color:#9cc6ef}
.inp.big{height:36px;font-size:14.5px;font-weight:700}

function occurrences(ev,rs,re){

  const dur=e-s, out=[], push=st=>{const en=new Date(st.getTime()+dur);if(st<re&&en>rs)out.push(Object.assign({},ev,{oStart:st,oEnd:en}))};
  const r=ev.repeat; if(!r){push(s);return out}
  const until=r.end==='until'?addD(P(r.until+'T00:00'),1):null, max=r.end==='for'?Math.max(1,+r.count||1):Infinity;
  let n=0, guard=0; const at=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),s.getHours(),s.getMinutes());
  const emit=st=>{if(st<s)return true;if(n>=max||(until&&st>=until)||st>=re)return false;n++;push(st);return true};
  const iv=Math.max(1,+r.interval||1);

  else if(r.freq==='monthly'){const pre=iv>1?`Every ${iv} months`:'Monthly';t=r.mMode==='nth'?`${pre} on the ${({1:'first',2:'second',3:'third',4:'fourth','-1':'last'})[r.nth]} ${DOW[r.nthDow]}`:`${pre} on day ${r.mDay}`}

function monthGrid(start,weeks,opt){
  const end=addD(start,weeks*7),occ=expand(start,end),T=TODAY();
  const cH=($('#content')||{}).clientHeight||600;const rowH=opt.compact?46:Math.max(90,(cH-25)/weeks);

      h+=`<div class="mg-cell ${cls}" data-act="cellAdd" data-date="${k}"><span class="mg-num ${numCls}" data-act="goDay" data-date="${k}">${num}</span>`;
      if(opt.compact){const all=[...segs.filter(s=>s.a<=i&&s.b>=i).map(s=>s.o),...singles[i]];if(all.length)h+=`<div class="cdots">${all.slice(0,5).map(o=>`<i style="background:${colorOf(o)}"></i>`).join('')}</div>`}
      else{
        const usedLanes=segs.filter(s=>s.a<=i&&s.b>=i);const hiddenBars=usedLanes.filter(s=>s.l>=maxLanes).length;
        const shownLanes=Math.min(usedLanes.reduce((m,s)=>Math.max(m,s.l+1),0),maxLanes);const avail=rowH-34-shownLanes*23;const fit=Math.max(0,Math.floor(avail/22));

          (rest>0?`<div class="more" data-act="dayList" data-date="${k}">+${rest} more</div>`:'')+`</div>`;
      }

/* time grid */
const HH=76;
const hrs=()=>S.settings.working?[9,19]:[0,24];
function timeGrid(days){
  const [h0,h1]=hrs(),n=days.length,T=TODAY(),rs=days[0],re=addD(days[n-1],1),occ=expand(rs,re);
  const cols=`grid-template-columns:repeat(${n},1fr)`;
  // all-day segments
  const segs=[];for(const o of occ){const sd=day0(o.oStart),ed=lastDayOf(o);if(!(o.allDay||!same(sd,ed)))continue;segs.push({o,a:Math.max(0,dd(sd,rs)),b:Math.min(n-1,dd(ed,rs)),cr:ed>days[n-1]})}
  const lanes=[];for(const s of segs){let l=lanes.findIndex(x=>x<s.a);if(l<0){l=lanes.length;lanes.push(-1)}lanes[l]=s.b;s.l=l}
  const adH=Math.max(1,lanes.length)*23+10;
  let h=`<div class="tg"><div class="tg-head"><div class="tg-gut"></div><div class="tg-heads" style="${cols}">${days.map(d=>`<div class="tg-dh ${same(d,T)?'today':''}" data-act="goDay" data-date="${ymd(d)}"><small>${n<=3&&S.view.type==='day'?DOW[d.getDay()].toUpperCase():DS[d.getDay()].toUpperCase()}</small><b>${d.getDate()}</b></div>`).join('')}</div></div>
  <div class="tg-ad"><div class="tg-gut"></div><div class="tg-adw" style="${cols};height:${adH}px">${days.map(d=>`<div class="tg-adc" data-act="adAdd" data-date="${ymd(d)}"></div>`).join('')}
  ${segs.map(s=>`<div class="abar ${s.cr?'cont-r':''}" data-act="ev" data-id="${s.o.id}" data-o="${ymd(s.o.oStart)}" style="left:calc(${s.a}*100%/${n} + 6px);width:calc(${s.b-s.a+1}*100%/${n} - ${s.cr?0:12}px);top:${5+s.l*23}px;background:${colorOf(s.o)}">${esc(s.o.title)}</div>`).join('')}</div></div>
  <div class="tg-body" id="tgBody"><div class="tg-inner" style="height:${(h1-h0)*HH}px"><div class="tg-hours">${Array.from({length:h1-h0},(_,i)=>i===0&&h0===0?'':`<div style="top:${i*HH}px${i===0?';transform:translateY(3px)':''}">${((h0+i)%12)||12} ${h0+i<12?'am':'pm'}</div>`).join('')}</div>

/* ============ smart parse ============ */
function parseSmart(text,base){
  let t=' '+text+' ',date=null,hasTime=false,hasDate=false,h=9,mi=0,dur=60,loc='';const B=day0(base||S.cursor);
  t=t.replace(/@\s*([\w-]+)/,(m,a)=>{loc=a;return ' '});
  t=t.replace(/\bfor\s+(\d+(?:\.\d+)?)\s*(hours?|hrs?|h|minutes?|mins?|m)\b/i,(m,n,u)=>{dur=/^h/i.test(u)?+n*60:+n;return ' '});
  t=t.replace(/\b(?:at\s+)?(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)\b/i,(m,a,b,ap)=>{h=(+a%12)+(/pm/i.test(ap)?12:0);mi=+(b||0);hasTime=true;return ' '});
  if(!hasTime)t=t.replace(/\bat\s+(\d{1,2})(?:[:.](\d{2}))?\b/i,(m,a,b)=>{h=+a;if(h<8)h+=12;mi=+(b||0);hasTime=true;return ' '});
  if(!hasTime)t=t.replace(/\b(noon)\b/i,()=>{h=12;hasTime=true;return ' '});
  const rep=(re,fn)=>{if(hasDate)return;t=t.replace(re,(...a)=>{const d=fn(...a);if(d){date=d;hasDate=true;return ' '}return a[0]})};
  rep(/\b(?:on\s+)?day after tomorrow\b/i,()=>addD(TODAY(),2));
  rep(/\b(?:on\s+)?(today|tonight)\b/i,()=>TODAY());
  rep(/\b(?:on\s+)?tomorrow\b/i,()=>addD(TODAY(),1));
  rep(/\bnext week\b/i,()=>addD(sow(TODAY()),7));
  rep(/\b(?:on\s+)?(?:(next)\s+)?(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/i,(m,nx,d)=>{const k=DS.findIndex(x=>x.toLowerCase()===d.toLowerCase());let x=TODAY();let n=(k-x.getDay()+7)%7||7;if(nx)n+=n<7?7:0;return addD(x,n)});
  const mIdx=s=>MS.findIndex(x=>x.toLowerCase()===s.slice(0,3).toLowerCase());
  rep(/\b(?:on\s+)?(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i,(m,d,mo)=>{let x=new Date(TODAY().getFullYear(),mIdx(mo),+d);if(x<TODAY())x.setFullYear(x.getFullYear()+1);return x});
  rep(/\b(?:on\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})(?:st|nd|rd|th)?\b/i,(m,mo,d)=>{let x=new Date(TODAY().getFullYear(),mIdx(mo),+d);if(x<TODAY())x.setFullYear(x.getFullYear()+1);return x});
  const d=date||B;const title=t.replace(/\s+(at|on|in|by)\s*$/i,'').replace(/\s+/g,' ').trim();
  const start=hasTime?new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,mi):day0(d);
  return {title,start,end:hasTime?addMin(start,dur):start,allDay:!hasTime,hasTime,hasDate,loc};
}

/* ============ date picker / repeat ============ */
function datePicker(anchor,{date,withTime,onPick}){
  let ref=mStart(date),sel=new Date(date);
  const el=openPop(anchor,'',{id:'dp'});
  const paint=()=>{const st=addD(ref,-ref.getDay()),T=TODAY();
    let g='';for(let i=0;i<42;i++){const d=addD(st,i);g+=`<div class="d ${d.getMonth()!==ref.getMonth()?'o':''} ${same(d,sel)?'s':''} ${same(d,T)?'t':''}" data-k="d" data-v="${ymd(d)}">${d.getDate()}</div>`}
    let tl='';if(withTime){for(let m=0;m<1440;m+=30){const hh=Math.floor(m/60),mm=m%60;const on=sel.getHours()===hh&&sel.getMinutes()===mm;tl+=`<div class="ti2 ${on?'s':''}" data-k="t" data-v="${m}"><span>${pad((hh%12)||12)}.${pad(mm)}</span><span>${hh<12?'AM':'PM'}</span></div>`}}
    el.innerHTML=`<div class="dp"><div class="cal"><div class="hd"><span style="display:flex"><button data-k="py">${I.dleft}</button><button data-k="pm">${I.left}</button></span><b style="font-weight:400">${MON[ref.getMonth()]} ${ref.getFullYear()}</b><span style="display:flex"><button data-k="nm">${I.right}</button><button data-k="ny">${I.dright}</button></span></div><div class="g">${'SMTWTFS'.split('').map(c=>`<div class="w">${c}</div>`).join('')}${g}</div></div>${withTime?`<div class="tl2"><div class="ar" data-k="tu">${I.up}</div><div class="sc">${tl}</div><div class="ar" data-k="td">${I.down}</div></div>`:''}</div>`;
    const sc=el.querySelector('.sc');if(sc){const s=sc.querySelector('.s');if(s)sc.scrollTop=s.offsetTop-80}};
  paint();placePop(pops[pops.length-1]);
  el.onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;
    if(k==='pm')ref=mStart(ref,-1);else if(k==='nm')ref=mStart(ref,1);else if(k==='py')ref=mStart(ref,-12);else if(k==='ny')ref=mStart(ref,12);
    else if(k==='tu'||k==='td'){el.querySelector('.sc').scrollTop+=k==='tu'?-90:90;return}
    else if(k==='d'){const d=P(b.dataset.v+'T00:00');sel=new Date(d.getFullYear(),d.getMonth(),d.getDate(),sel.getHours(),sel.getMinutes());onPick(sel);if(!withTime){closePopId('dp');return}}
    else if(k==='t'){const m=+b.dataset.v;sel=new Date(sel.getFullYear(),sel.getMonth(),sel.getDate(),Math.floor(m/60),m%60);onPick(sel);closePopId('dp');return}
    const st=el.querySelector('.sc')?.scrollTop;paint();if(st!=null&&k!=='d')el.querySelector('.sc').scrollTop=st};
}
function repeatPop(anchor,init,{onChange,buttons,onOk}){
  let R=JSON.parse(JSON.stringify(init));let showDays=false;
  const el=openPop(anchor,'',{id:'repeat'});
  const sel=(k,opts,v,cls='')=>`<select class="sel flat ${cls}" data-s="${k}">${opts.map(([a,b])=>`<option value="${a}" ${String(v)===String(a)?'selected':''}>${b}</option>`).join('')}</select>`;
  const rad=(k,v,lab)=>`<span class="rad ${String(R[k])===String(v)?'on':''}" data-r="${k}" data-v="${v}"><i></i>${lab}</span>`;
  const paint=()=>{let body='';
    if(R.freq==='daily')body=`<div class="r">${rad('weekday','false','Every')}<input class="num" data-n="interval" value="${R.interval}"> day(s) once</div><div class="r">${rad('weekday','true','Every weekday')}</div>`;
    else if(R.freq==='weekly'){const ds=(R.days.length?R.days:[1]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7));body=`<div class="r">Every <input class="num" data-n="interval" value="${R.interval}"> week(s) once on <span class="dsel"><button class="sel flat" data-k="days" style="min-width:90px;text-align:left;color:var(--link)">${ds.map(d=>DS[d]).join(', ')}</button>${showDays?`<div class="dlist">${[1,2,3,4,5,6,0].map(d=>`<label data-day="${d}"><span class="cb ${R.days.includes(d)?'on':''}"><span class="box">${I.check.replace('width="11" height="11"','width="9" height="9"')}</span></span>${DOW[d]}</label>`).join('')}</div>`:''}</span></div>`}
    else if(R.freq==='monthly')body=`<div class="r">${rad('mMode','day','Day')}<input class="num" data-n="mDay" value="${R.mDay}"> of every <input class="num" data-n="interval" value="${R.interval}"> month(s)</div><div class="r">${rad('mMode','nth','The')}${sel('nth',[[1,'first'],[2,'second'],[3,'third'],[4,'fourth'],[-1,'last']],R.nth)}${sel('nthDow',DS.map((d,i)=>[i,d.toLowerCase()]),R.nthDow)} of every <input class="num" data-n="interval" value="${R.interval}"> month(s)</div>`;
    else body=`<div class="r">Every <input class="num" data-n="interval" value="${R.interval}"> year(s)</div>`;
    el.innerHTML=`<div class="rpp"><div class="ph">Repeat</div><div class="r">${sel('freq',[['daily','Daily'],['weekly','Weekly'],['monthly','Monthly'],['yearly','Yearly']],R.freq)}${sel('end',[['forever','forever'],['until','until'],['for','for']],R.end)}${R.end==='until'?`<input type="date" class="sel flat" data-n="until" value="${R.until}">`:''}${R.end==='for'?`<input class="num" data-n="count" value="${R.count}"> times`:''}</div>${body}
      ${buttons?`<div class="btns"><button class="btn pri" data-k="ok">Ok</button><button class="btn sec" data-k="cancel">Cancel</button></div>`:''}</div>`;
  };
  const changed=()=>{if(!buttons)onChange(JSON.parse(JSON.stringify(R)))};
  paint();placePop(pops[pops.length-1]);
  el.addEventListener('change',e=>{const s=e.target.dataset.s;if(s){R[s]=['nth','nthDow'].includes(s)?+e.target.value:e.target.value;if(s==='freq'&&R.freq==='weekly'&&!R.days.length)R.days=[1];paint();changed()}else if(e.target.dataset.n==='until'){R.until=e.target.value;changed()}});
  el.addEventListener('input',e=>{const n=e.target.dataset.n;if(n&&n!=='until'){R[n]=Math.max(1,parseInt(e.target.value)||1);changed()}});
  el.addEventListener('click',e=>{const r=e.target.closest('[data-r]');if(r){let v=r.dataset.v;R[r.dataset.r]=v==='true'?true:v==='false'?false:v;paint();changed();return}
    const dy=e.target.closest('[data-day]');if(dy){e.preventDefault();const d=+dy.dataset.day;R.days=R.days.includes(d)?R.days.filter(x=>x!==d):[...R.days,d];if(!R.days.length)R.days=[d];paint();changed();return}
    const k=e.target.closest('[data-k]');if(!k)return;if(k.dataset.k==='days'){showDays=!showDays;paint();return}
    if(k.dataset.k==='ok'){onOk&&onOk(R);closePopId('repeat')}if(k.dataset.k==='cancel')closePopId('repeat')});
}

function fbHTML(){

function bindRF(p){

  p.onchange=e=>{if(e.target.dataset.rf==='addAtt'&&e.target.value){sync();RF.attendees.push(e.target.value);renderRPanel()}};

    if(k==='date'||k==='time'){sync();datePicker(b,{date:P(RF.date+'T'+RF.time),withTime:k==='time',onPick:d=>{RF.date=ymd(d);RF.time=`${pad(d.getHours())}:${pad(d.getMinutes())}`;renderRPanel()}})}
    else if(k==='reptog'){sync();RF.repeat=RF.repeat?null:defRepeat(P(RF.date+'T00:00'));renderRPanel()}
    else if(k==='rep'){sync();if(!RF.repeat)RF.repeat=defRepeat(P(RF.date+'T00:00'));repeatPop(b,RF.repeat,{onChange:r=>{RF.repeat=r;$('#rfRep').textContent=repeatText(r);$('[data-rf="reptog"]').classList.add('on')}})}
    else if(k==='rmAtt'){sync();RF.attendees=RF.attendees.filter(a=>a!==b.dataset.v);renderRPanel()}
    else if(k==='mail'||k==='popup'){sync();RF[k]=!RF[k];renderRPanel()}

function searchPop(anchor){

  const el=openPop(anchor,`<div class="srch"><input id="sIn" placeholder="Search Events (/ + c)" autocomplete="off"><div class="hints" id="sHints"><div data-p="title:">title: <span>text</span></div><div data-p="location:">location: <span>text</span></div><div data-p="organizer:">organizer: <span>text/emailid</span></div></div><div class="res" id="sRes"></div></div>`,{id:'search',place:'end'});
  const inp=$('#sIn');setTimeout(()=>inp.focus(),20);
  const run=()=>{const raw=inp.value.trim();$('#sHints').style.display=raw?'none':'';const res=$('#sRes');if(!raw){res.innerHTML='';return}
    let field='any',q=raw.toLowerCase();const m=raw.match(/^(title|location|organizer):\s*(.*)$/i);if(m){field=m[1].toLowerCase();q=m[2].toLowerCase()}
    if(!q){res.innerHTML='';return}
    const hits=S.events.filter(e=>{const t=e.title.toLowerCase(),l=(e.location||'').toLowerCase(),o=(e.attendees.join(' ')+' '+(calOf(e.cal).owner||'')).toLowerCase();return field==='title'?t.includes(q):field==='location'?l.includes(q):field==='organizer'?o.includes(q):(t.includes(q)||l.includes(q)||(e.desc||'').toLowerCase().includes(q))}).slice(0,12);
    const hl=s=>esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),x=>`<mark>${x}</mark>`);
    res.innerHTML=hits.length?hits.map(e=>{const s=P(e.start);return `<div class="it" data-id="${e.id}"><i style="background:${colorOf(e)}"></i><div><b>${hl(e.title)}</b><small>${e.unscheduled?'Unscheduled':fD(s)+(e.allDay?' · All day':' · '+fT(s))}${e.location?' · @'+hl(e.location):''}${e.repeat?' · ↻':''}</small></div></div>`}).join(''):`<div class="it" style="color:#999;cursor:default">No events found for “${esc(q)}”</div>`};
  inp.oninput=run;
  el.onclick=e=>{const h=e.target.closest('[data-p]');if(h){inp.value=h.dataset.p+' ';inp.focus();run();return}const it=e.target.closest('.it[data-id]');if(!it)return;const ev=S.events.find(x=>x.id===it.dataset.id);closeAllPops();

    const cal=calOf(ev.cal);if(!cal.on){cal.on=true}S.cursor=day0(P(ev.start));S.view={type:'day',n:1};render();
    setTimeout(()=>{const node=$(`[data-id="${ev.id}"]`);if(node){node.scrollIntoView({block:'center'});openDetails(node,ev.id,ymd(P(ev.start)))}},40)};

  else if(e.key==='ArrowLeft'&&S.page==='cal')ACT.nav({dataset:{d:-1}});
  else if(e.key==='ArrowRight'&&S.page==='cal')ACT.nav({dataset:{d:1}});
  else if('dwmya'.includes(e.key)&&S.page==='cal'){S.view={type:{d:'day',w:'week',m:'month',y:'year',a:'agenda'}[e.key],n:1};render()}
});
let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{closeAllPops();if(S.page==='cal')renderContent(),renderRPanel()},120)});
setInterval(()=>{if(S.page==='cal'&&['day','week','work'].includes(S.view.type)&&!pops.length&&!document.querySelector('.tev.drag')){const b=$('#tgBody');const st=b&&b.scrollTop;renderContent();const b2=$('#tgBody');if(b2&&st!=null)b2.scrollTop=st}},60000);

load();if(innerWidth<760)S.collapsed=true;render();

// first-visit hint for portfolio visitors
(function(){let seen=false;try{seen=localStorage.getItem('calproto.hint')==='1'}catch(e){}if(seen)return;
  const h=document.createElement('div');h.id='hint';h.innerHTML=`<button class="hx" aria-label="Close">${I.x}</button><b>Interactive prototype</b>Everything here works — try:<ul><li>Click any day or drag in a time slot to add an event</li><li><b style="display:inline;font-size:12px">New Event</b> for the full form with repeat, attendees &amp; free/busy</li><li>Drag events to move or resize them</li><li>Switch views from the <b style="display:inline;font-size:12px">Month ▾</b> menu</li></ul><span style="color:#888;font-size:11px">Changes are saved in your browser · ⋮ → Reset demo data</span>`;
  document.body.appendChild(h);h.querySelector('.hx').onclick=()=>{h.remove();try{localStorage.setItem('calproto.hint','1')}catch(e){}};})();
</script>
