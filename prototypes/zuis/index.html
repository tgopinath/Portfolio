<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZUIS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ============================== tokens ============================== */
:root{
  --bg:#f5f5f8; --surface:#ffffff; --surface2:#f0f0f4; --surface3:#e7e7ee;
  --line:#e4e4ec; --line2:#d3d3df;
  --ink:#15151b; --ink2:#53535f; --muted:#7f7f8d;
  --accent:#5b5bd6; --accent-h:#4e4ec6; --accent-soft:#eeeefb; --on-accent:#ffffff;
  --star:#dfa70c; --danger:#cf3b3b; --ok:#0f9b6c; --warn:#b0761c;
  --sh1:0 1px 2px rgb(18 18 30/.05);
  --sh2:0 1px 3px rgb(18 18 30/.07),0 10px 26px -14px rgb(18 18 30/.18);
  --sh3:0 2px 8px rgb(18 18 30/.08),0 26px 60px -22px rgb(18 18 30/.30);
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --bg:#08080b; --surface:#121216; --surface2:#1a1a20; --surface3:#23232b;
  --line:#26262f; --line2:#35353f;
  --ink:#ededf1; --ink2:#b5b5c0; --muted:#84848f;
  --accent:#7b7bf0; --accent-h:#8b8bf5; --accent-soft:#1b1b31; --on-accent:#0b0b12;
  --star:#f0c644; --danger:#ef6a6a; --ok:#33c294; --warn:#dda03c;
  --sh1:0 1px 2px rgb(0 0 0/.5);
  --sh2:0 1px 3px rgb(0 0 0/.55),0 10px 26px -14px rgb(0 0 0/.75);
  --sh3:0 2px 8px rgb(0 0 0/.6),0 26px 60px -22px rgb(0 0 0/.9);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#08080b; --surface:#121216; --surface2:#1a1a20; --surface3:#23232b;
  --line:#26262f; --line2:#35353f;
  --ink:#ededf1; --ink2:#b5b5c0; --muted:#84848f;
  --accent:#7b7bf0; --accent-h:#8b8bf5; --accent-soft:#1b1b31; --on-accent:#0b0b12;
  --star:#f0c644; --danger:#ef6a6a; --ok:#33c294; --warn:#dda03c;
  --sh1:0 1px 2px rgb(0 0 0/.5);
  --sh2:0 1px 3px rgb(0 0 0/.55),0 10px 26px -14px rgb(0 0 0/.75);
  --sh3:0 2px 8px rgb(0 0 0/.6),0 26px 60px -22px rgb(0 0 0/.9);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 14px/1.5 Inter,ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.scroll{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.scroll::-webkit-scrollbar{width:10px;height:10px}
.scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:3px solid transparent;background-clip:content-box}
.nobar::-webkit-scrollbar{display:none}
.nobar{scrollbar-width:none}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes left{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes starpop{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}
.a-fade{animation:fade .2s var(--ease) both}
.a-pop{animation:pop .22s var(--ease) both}
.a-up{animation:up .3s var(--ease) both}
.a-left{animation:left .26s var(--ease) both}
.stagger>*{animation:up .34s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.01s}.stagger>*:nth-child(2){animation-delay:.03s}
.stagger>*:nth-child(3){animation-delay:.05s}.stagger>*:nth-child(4){animation-delay:.07s}
.stagger>*:nth-child(5){animation-delay:.09s}.stagger>*:nth-child(6){animation-delay:.11s}
.stagger>*:nth-child(7){animation-delay:.13s}.stagger>*:nth-child(8){animation-delay:.15s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ============================== shell ============================== */
#app{display:flex;height:100dvh;overflow:hidden}

.side{
  width:236px;flex:0 0 auto;display:flex;flex-direction:column;
  background:var(--surface);border-right:1px solid var(--line);
  transition:width .25s var(--ease);
}
.side.collapsed{width:68px}
.brand{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;flex:0 0 auto}
.side.collapsed .brand{padding:0 8px;justify-content:center}
.mark{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;border-radius:9px;background:var(--accent);color:var(--on-accent);box-shadow:var(--sh1)}
.brand b{display:block;font-size:14px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.brand span{display:block;font-size:11px;color:var(--muted)}
.side-pad{padding:0 12px 8px}
.side.collapsed .side-pad{padding:0 8px 8px}
.nav{flex:1;overflow-y:auto;padding:0 12px 8px;display:flex;flex-direction:column;gap:2px}
.side.collapsed .nav{padding:0 8px 8px}
.nav-i{
  display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:10px;
  font-size:13px;font-weight:500;color:var(--ink2);position:relative;width:100%;text-align:left;
  transition:background .14s,color .14s;
}
.nav-i:hover{background:var(--surface2);color:var(--ink)}
.nav-i.on{background:var(--accent-soft);color:var(--accent)}
.nav-i.on::before{content:"";position:absolute;left:-12px;width:3px;height:16px;border-radius:0 3px 3px 0;background:var(--accent)}
.side.collapsed .nav-i{justify-content:center;padding:0}
.side.collapsed .nav-i.on::before{display:none}
.nav-i .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-i .cnt{font-size:11.5px;color:var(--muted)}
.side.collapsed .lbl,.side.collapsed .cnt{display:none}
.nav-h{display:flex;align-items:center;justify-content:space-between;padding:16px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
.side-foot{flex:0 0 auto;border-top:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.side.collapsed .side-foot{padding:8px}
.avatar{width:28px;height:28px;flex:0 0 auto;display:grid;place-items:center;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  height:56px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 20px;
  border-bottom:1px solid var(--line);background:color-mix(in oklab,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);position:relative;z-index:30;
}
.content{flex:1;overflow-y:auto}
.wrap{max-width:1600px;margin:0 auto;padding:26px 24px 56px}

/* ============================== controls ============================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;
  border-radius:10px;border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:500;transition:all .14s;white-space:nowrap;
}
.btn:hover{background:var(--surface2);border-color:var(--line2)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--on-accent);box-shadow:var(--sh1)}
.btn.pri:hover{background:var(--accent-h)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px}
.btn.wide{width:100%}
.btn.on{border-color:color-mix(in oklab,var(--accent) 45%,transparent);color:var(--accent)}
.iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:var(--muted);transition:all .14s}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}
.iconbtn.on{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted);transition:all .14s}
.seg button.on{background:var(--surface2);color:var(--ink);box-shadow:var(--sh1)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);font-size:11.5px;font-weight:500;color:var(--ink2);max-width:100%}
.pill.click{cursor:pointer}
.pill.click:hover{border-color:var(--line2);color:var(--ink)}
.pill.on{border-color:color-mix(in oklab,var(--accent) 45%,transparent);background:var(--accent-soft);color:var(--accent)}
.pill .d{width:6px;height:6px;border-radius:99px;flex:0 0 auto}
.type{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;border:1px solid;font-size:10px;font-weight:700;letter-spacing:.03em}
.t-pdf{color:#c8386a;border-color:#c8386a40;background:#c8386a1a}
.t-pptx,.t-ppt{color:#b2700f;border-color:#b2700f40;background:#b2700f1a}
.sw{position:relative;width:40px;height:24px;border-radius:99px;background:var(--surface3);transition:background .2s;flex:0 0 auto}
.sw.on{background:var(--accent)}
.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:99px;background:#fff;box-shadow:var(--sh1);transition:left .2s var(--ease)}
.sw.on i{left:18px}

.searchbox{display:flex;align-items:center;gap:8px;height:34px;width:100%;max-width:560px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:all .15s}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 16%,transparent)}
.searchbox input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:13.5px}
.searchbox input::placeholder{color:var(--muted)}
kbd{border:1px solid var(--line);border-radius:5px;padding:1px 5px;font:inherit;font-size:10.5px;color:var(--muted)}

/* ============================== cards ============================== */
.card{
  display:flex;flex-direction:column;overflow:hidden;text-align:left;width:100%;
  border:1px solid var(--line);border-radius:14px;background:var(--surface);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s;
}
.card:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--sh2)}
.card .shot{position:relative;overflow:hidden;background:var(--surface2)}
.card .veil{position:absolute;inset:0;background:linear-gradient(to top,rgb(0 0 0/.26),transparent 55%);opacity:0;transition:opacity .2s}
.card:hover .veil{opacity:1}
.card .tl{position:absolute;left:8px;top:8px;display:flex;gap:6px}
.card .tr{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.chip{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:color-mix(in oklab,var(--surface) 86%,transparent);backdrop-filter:blur(6px);color:var(--muted);opacity:0;transition:opacity .15s,color .15s}
.card:hover .chip{opacity:1}
.chip:hover{color:var(--ink)}
.chip.fav{opacity:1;color:var(--star)}
.card .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgb(0 0 0/.14)}
.card .bar i{display:block;height:100%;background:var(--accent)}
.card .body{display:flex;flex-direction:column;gap:6px;padding:12px 14px 13px;flex:1}
.card h3{margin:0;font-size:13.5px;font-weight:600;letter-spacing:-.008em;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .body p{margin:0}
.card .meta{font-size:12px;color:var(--muted)}
.card .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:4px}
.card.compact .body{padding:9px 10px 10px;gap:3px}
.card.compact h3{font-size:12.5px}
.card.compact .meta{font-size:11px}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.rail>*{flex:0 0 218px;scroll-snap-align:start}

.list{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.lrow{display:grid;grid-template-columns:56px minmax(0,1fr) 64px 130px 110px 76px 64px;align-items:center;gap:12px;padding:8px 12px;width:100%;text-align:left;border-top:1px solid var(--line);transition:background .12s}
.lrow:first-child{border-top:0}
.lhead{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
.lrow.item:hover{background:var(--surface2)}
.lrow .thumb{border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
.lrow .nm{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .sub{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:11.5px;color:var(--muted);overflow:hidden}
.lrow .cell{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .acts{display:flex;justify-content:flex-end;gap:2px;opacity:0;transition:opacity .14s}
.lrow.item:hover .acts{opacity:1}
@media (max-width:1100px){
  .lrow{grid-template-columns:56px minmax(0,1fr) 64px 64px}
  .lrow .hide{display:none}
}

.coll{position:relative;display:block;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--surface);width:100%;text-align:left;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.coll:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.coll .cover{position:relative;aspect-ratio:16/9;overflow:hidden}
.coll .cover .fade{position:absolute;inset:0;background:linear-gradient(to top,rgb(0 0 0/.5),transparent 62%)}
.coll .cap{position:absolute;left:0;right:0;bottom:0;padding:12px}
.coll .cap b{display:block;color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 3px rgb(0 0 0/.4)}
.coll .cap span{display:block;color:rgb(255 255 255/.78);font-size:12px}
.coll p{margin:0;padding:11px 14px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.dashed{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:140px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:13px;font-weight:500;transition:all .18s}
.dashed:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

.sect{margin-bottom:34px}
.sect-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:13px}
.sect-h h2{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.015em}
.sect-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.more{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:500;color:var(--accent)}
h1.page{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}
.page-h .sub{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.toolbar .count{margin-right:auto;font-size:13px;color:var(--muted)}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:80px 20px}
.empty .ic{display:grid;place-items:center;width:56px;height:56px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--muted);box-shadow:var(--sh1);margin-bottom:18px}
.empty h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.empty p{margin:6px 0 0;max-width:24rem;font-size:13.5px;line-height:1.6;color:var(--muted)}

/* ============================== slide renderer ============================== */
.frame{container-type:inline-size;position:relative;width:100%;aspect-ratio:16/9;overflow:hidden}
.slide{position:absolute;inset:0;padding:6.5cqw 7.5cqw;display:flex;flex-direction:column;font-family:Inter,sans-serif}
.slide .wash{position:absolute;inset:0}
.slide>*{position:relative}
.slide .eyebrow{font-size:1.6cqw;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.slide .rule{width:5.5cqw;height:.5cqw;border-radius:.3cqw;margin-bottom:2.2cqw}
.slide h4{margin:0;font-size:3.9cqw;font-weight:700;letter-spacing:-.02em;line-height:1.12;text-wrap:balance}
.slide.hero h4{font-size:5.5cqw}
.slide .lede{margin:1.4cqw 0 0;font-size:2.4cqw;line-height:1.35;font-weight:400}
.slide .after-h{margin-top:2.6cqw;flex:1;min-height:0}
.slide ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1.9cqw}
.slide li{display:flex;align-items:flex-start;gap:1.6cqw;font-size:2.35cqw;font-weight:500;line-height:1.25}
.slide li .b{margin-top:.75cqw;width:1cqw;height:1cqw;border-radius:99px;flex:0 0 auto}
.slide li .n{flex:0 0 auto;display:grid;place-items:center;width:3.2cqw;height:3.2cqw;border-radius:.9cqw;font-size:1.6cqw;font-weight:700}
.slide .mrow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2cqw}
.slide .mcard{border:.13cqw solid;border-radius:1.4cqw;padding:2.2cqw}
.slide .mcard b{display:block;font-size:4.7cqw;font-weight:700;letter-spacing:-.03em;line-height:1}
.slide .mcard span{display:block;margin-top:1.4cqw;font-size:1.85cqw;font-weight:600}
.slide .mcard i{display:block;margin-top:.6cqw;font-size:1.5cqw;font-style:normal}
.slide .chart{display:flex;align-items:flex-end;gap:2.4cqw;height:26cqw;padding-top:2cqw;border-bottom:.13cqw solid}
.slide .bar{flex:1;max-width:7.5cqw;display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.slide .bar em{font-size:1.6cqw;font-style:normal;font-weight:700}
.slide .bar u{display:block;width:100%;border-radius:.6cqw .6cqw 0 0;text-decoration:none}
.slide .xlabels{display:flex;gap:2.4cqw;margin-top:1cqw}
.slide .xlabels span{flex:1;max-width:7.5cqw;text-align:center;font-size:1.5cqw;font-weight:500}
.slide blockquote{margin:0;border-radius:1.6cqw;padding:3cqw 3.2cqw}
.slide blockquote p{margin:0;font-size:2.7cqw;font-weight:500;line-height:1.32}
.slide blockquote cite{display:block;margin-top:2cqw;font-size:1.75cqw;font-style:normal;font-weight:500}
.slide .foot{display:flex;justify-content:space-between;font-size:1.5cqw;font-weight:500;padding-top:1.5cqw}
.frame.tiny .slide{padding:6.5cqw 7.5cqw}

/* ============================== overlays ============================== */
.backdrop{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.backdrop::before{content:"";position:absolute;inset:0;background:rgb(0 0 0/.36);backdrop-filter:blur(2px);animation:fade .2s both}
:root[data-theme="dark"] .backdrop::before{background:rgb(0 0 0/.62)}
.modal{position:relative;width:100%;max-width:520px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--sh3);animation:pop .22s var(--ease) both}
.modal.lg{max-width:720px}
.modal header{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 0}
.modal header h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.modal header p{margin:4px 0 0;font-size:13px;line-height:1.55;color:var(--muted)}
.modal .mbody{padding:14px 18px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:13px 18px;border-top:1px solid var(--line)}
.field{display:block;margin-bottom:14px}
.field>span{display:block;margin-bottom:6px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.inp{width:100%;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13.5px;outline:0}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 16%,transparent)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:38px 20px;border:2px dashed var(--line);border-radius:16px;background:color-mix(in oklab,var(--surface2) 60%,transparent);text-align:center;transition:all .2s;cursor:pointer;width:100%}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .ic{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--surface);color:var(--muted);box-shadow:var(--sh1);margin-bottom:6px;transition:all .2s}
.drop.over .ic{background:var(--accent);color:#fff;transform:scale(1.08)}
.note{display:flex;gap:9px;margin-top:12px;padding:10px 12px;border:1px solid color-mix(in oklab,var(--warn) 30%,transparent);border-radius:12px;background:color-mix(in oklab,var(--warn) 8%,transparent);font-size:12.5px;line-height:1.55;color:var(--ink2)}
.prog{height:5px;border-radius:99px;background:var(--surface3);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}

.menu{position:fixed;z-index:95;min-width:212px;padding:5px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--sh3);animation:pop .18s var(--ease) both}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border-radius:8px;font-size:13px;text-align:left;color:var(--ink);transition:background .12s}
.menu button:hover{background:var(--surface2)}
.menu button.dngr{color:var(--danger)}
.menu button.dngr:hover{background:color-mix(in oklab,var(--danger) 10%,transparent)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.menu .mi{color:var(--muted);display:grid;place-items:center;width:16px}
.menu button.dngr .mi{color:var(--danger)}

.pop{position:absolute;top:calc(100% + 6px);right:0;z-index:40;min-width:230px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--sh3);animation:pop .18s var(--ease) both;text-align:left}
.pop h5{margin:0 0 7px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pop .grp{margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
.pop .opt{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:8px;font-size:13px;text-align:left}
.pop .opt:hover{background:var(--surface2)}

.sheet{position:fixed;inset:0;z-index:85}
.sheet .veil{position:absolute;inset:0;background:rgb(0 0 0/.28);animation:fade .2s both}
:root[data-theme="dark"] .sheet .veil{background:rgb(0 0 0/.58)}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--surface);box-shadow:var(--sh3);animation:left .26s var(--ease) both}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.panel header b{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.panel .pbody{flex:1;overflow-y:auto;padding:0 16px 18px}
.dl{display:flex;flex-direction:column;gap:9px;font-size:13px}
.dl>div{display:flex;gap:12px}
.dl dt{width:88px;flex:0 0 auto;font-size:12.5px;color:var(--muted)}
.dl dd{margin:0;flex:1;min-width:0;word-break:break-word}
.panel footer{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border-top:1px solid var(--line)}
.pact{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:9px;font-size:11.5px;font-weight:500;color:var(--ink2);transition:background .12s}
.pact:hover{background:var(--surface2);color:var(--ink)}
.pact.dngr{grid-column:span 4;color:var(--danger)}
.pact.dngr:hover{background:color-mix(in oklab,var(--danger) 10%,transparent)}

.toasts{position:fixed;left:50%;bottom:22px;z-index:100;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;width:min(430px,calc(100% - 32px))}
.toast{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--sh3);animation:pop .24s var(--ease) both}
.toast .ic{display:grid;place-items:center;width:24px;height:24px;border-radius:99px;background:color-mix(in oklab,var(--ok) 14%,transparent);color:var(--ok);flex:0 0 auto}
.toast p{margin:0;flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast .undo{color:var(--accent);font-size:13px;font-weight:500;padding:4px 8px;border-radius:8px}
.toast .undo:hover{background:var(--accent-soft)}

/* ============================== viewer ============================== */
.viewer{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;background:#08080a;color:#fff;animation:fade .2s both}
.vtop,.vbot{display:flex;align-items:center;gap:6px;height:56px;flex:0 0 auto;padding:0 12px}
.vtop{border-bottom:1px solid rgb(255 255 255/.1)}
.vbot{border-top:1px solid rgb(255 255 255/.1);position:relative}
.vbot .track{position:absolute;left:0;right:0;top:0;height:2px;background:rgb(255 255 255/.12)}
.vbot .track i{display:block;height:100%;background:var(--accent);transition:width .3s}
.vtitle{flex:1;min-width:0;text-align:center}
.vtitle b{display:block;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtitle span{display:block;font-size:11.5px;color:rgb(255 255 255/.45)}
.vbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:rgb(255 255 255/.65);transition:all .14s}
.vbtn:hover{background:rgb(255 255 255/.1);color:#fff}
.vbtn.on{background:rgb(255 255 255/.16);color:#fff}
.vbtn:disabled{opacity:.3;cursor:default}
.vtext{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:10px;font-size:13px;font-weight:500;color:rgb(255 255 255/.7);transition:all .14s}
.vtext:hover{background:rgb(255 255 255/.1);color:#fff}
.vmid{flex:1;min-height:0;display:flex}
.vrail{width:190px;flex:0 0 auto;display:flex;flex-direction:column;border-right:1px solid rgb(255 255 255/.1);background:rgb(0 0 0/.35)}
.vrail>b{padding:10px 12px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:rgb(255 255 255/.45)}
.vrail .list2{flex:1;overflow-y:auto;padding:0 12px 16px;display:flex;flex-direction:column;gap:9px}
.vrail button{text-align:left}
.vrail em{display:block;font-style:normal;font-size:10.5px;font-weight:600;color:rgb(255 255 255/.4);margin-bottom:4px}
.vrail button.on em{color:#fff}
.vrail .fr{border:2px solid transparent;border-radius:7px;overflow:hidden;transition:border-color .15s}
.vrail button:hover .fr{border-color:rgb(255 255 255/.3)}
.vrail button.on .fr{border-color:var(--accent)}
.vstage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:26px;overflow:auto;position:relative}
.vslide{width:min(100%,calc((100dvh - 172px) * 16 / 9));border-radius:6px;overflow:hidden;box-shadow:0 24px 70px -20px rgb(0 0 0/.8);transition:transform .2s var(--ease)}
.vgrid{flex:1;overflow-y:auto;padding:20px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));align-content:start}
.vgrid button{border:2px solid transparent;border-radius:9px;overflow:hidden;transition:border-color .15s}
.vgrid button:hover{border-color:rgb(255 255 255/.3)}
.vgrid button.on{border-color:var(--accent)}
.vgrid span{display:block;padding:4px;text-align:center;font-size:11px;color:rgb(255 255 255/.6);background:rgb(0 0 0/.5)}
.zone{position:absolute;top:0;bottom:0;width:13%;cursor:pointer}
.resume{position:absolute;left:50%;bottom:78px;z-index:5;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:12px 14px;border:1px solid rgb(255 255 255/.12);border-radius:14px;background:#16161c;box-shadow:0 20px 50px -14px rgb(0 0 0/.9);animation:up .3s var(--ease) both}
.resume b{display:block;font-size:13.5px;font-weight:500}
.resume span{display:block;font-size:12px;color:rgb(255 255 255/.5)}
.keys{position:fixed;inset:0;z-index:96;display:grid;place-items:center;padding:16px;background:rgb(0 0 0/.62)}
.keys .box{width:min(420px,100%);padding:20px;border:1px solid rgb(255 255 255/.12);border-radius:18px;background:#16161c;color:#fff;animation:pop .2s var(--ease) both}
.keys h2{margin:0 0 14px;font-size:15px;font-weight:600}
.keys .row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 0}
.keys kbd{border-color:rgb(255 255 255/.16);background:rgb(255 255 255/.08);color:rgb(255 255 255/.82)}
.keys .row span{font-size:13px;color:rgb(255 255 255/.6)}

.hintbar{display:flex;align-items:center;gap:8px;justify-content:center;padding:9px 16px;border-top:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted);flex:0 0 auto}
.hintbar b{color:var(--ink);font-weight:600}
@media (max-width:820px){ .side{display:none} .hintbar{display:none} }
</style>

<style>
/* ---------------------------------------------------- prototype additions */
.frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--surface2)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.lrow .thumb .frame{aspect-ratio:16/9}
.vslide{max-width:100%;max-height:calc(100dvh - 172px);border-radius:6px;box-shadow:0 24px 70px -20px rgb(0 0 0/.8);transition:transform .2s var(--ease);background:#fff}
.vrail .fr img,.vgrid img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#fff}
.adminbadge{border-radius:4px;background:var(--accent-soft);color:var(--accent);padding:0 4px;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}

/* sign in ------------------------------------------------------------- */
.signin{display:grid;height:100dvh;grid-template-columns:1fr}
@media (min-width:1000px){ .signin{grid-template-columns:1fr minmax(420px,44%)} }
.signin aside{display:none;position:relative;overflow:hidden;flex-direction:column;justify-content:space-between;padding:48px;background:var(--surface)}
@media (min-width:1000px){ .signin aside{display:flex} }
.signin aside::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 85% 0%, color-mix(in oklab, var(--accent) 15%, transparent), transparent 60%)}
.signin aside>*{position:relative}
.brandline{display:flex;align-items:center;gap:10px}
.brandline b{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em}
.brandline span{display:block;font-size:12px;color:var(--muted)}
.pitch{max-width:30rem}
.pitch h1{margin:0;font-size:30px;font-weight:600;line-height:1.15;letter-spacing:-.03em;text-wrap:balance}
.pitch>p{margin:12px 0 0;font-size:14px;line-height:1.65;color:var(--muted)}
.pitch dl{margin:32px 0 0;display:flex;flex-direction:column;gap:16px}
.pitch dl>div{display:flex;gap:12px}
.pitch dl>div>span{display:grid;place-items:center;width:28px;height:28px;flex:0 0 auto;margin-top:2px;border-radius:9px;background:var(--accent-soft);color:var(--accent)}
.pitch dt{font-size:13.5px;font-weight:500}
.pitch dd{margin:0;font-size:13px;color:var(--muted)}
.signin .foot{font-size:12px;color:var(--muted)}
.signin main{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg)}
.signin form{width:100%;max-width:24rem}
.signin h2{margin:0;font-size:21px;font-weight:600;letter-spacing:-.02em}
.signin .lede{margin:6px 0 0;font-size:13.5px;line-height:1.6;color:var(--muted)}
.linkish{font-size:12.5px;font-weight:500;color:var(--muted)}
.linkish:hover{color:var(--ink)}
.authtabs{display:flex;gap:2px;margin:0 0 22px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.authtabs button{flex:1;height:32px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s}
.authtabs button:hover{color:var(--ink)}
.authtabs button.on{background:var(--surface2);color:var(--ink);box-shadow:0 1px 2px rgba(16,18,27,.06)}
.who{display:flex;flex-direction:column;gap:8px;margin:22px 0}
.whobtn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;transition:all .15s}
.whobtn:hover{border-color:var(--line2)}
.whobtn.on{border-color:color-mix(in oklab,var(--accent) 45%,transparent);background:var(--accent-soft);color:var(--accent)}
.whobtn b{display:block;font-size:13.5px;font-weight:500}
.whobtn span span{display:block;font-size:12px;color:var(--muted)}
.whobtn.on span span{color:color-mix(in oklab,var(--accent) 70%,var(--muted))}
.fld{display:block;margin-bottom:14px}
.lede+.fld{margin-top:22px}
.fld>span{display:block;margin-bottom:6px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.fld input{width:100%;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13.5px;outline:0}
.fld input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 16%,transparent)}
.err{display:flex;gap:8px;margin:14px 0 0;padding:10px 12px;border:1px solid color-mix(in oklab,var(--danger) 28%,transparent);border-radius:12px;background:color-mix(in oklab,var(--danger) 8%,transparent);font-size:12.5px;line-height:1.55;color:var(--ink2)}
.err svg{flex:0 0 auto;margin-top:1px;color:var(--danger)}
.hintline{margin:14px 0 0;font-size:12.5px;color:var(--muted)}
.hintline b{color:var(--ink)}

/* settings ------------------------------------------------------------ */
.setcard{margin-bottom:16px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.setcard-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.setcard-h h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.setrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:4px 0}
.setrow p{margin:0;font-size:13.5px;font-weight:500}
.setrow span{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
.rolechip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:7px;background:var(--surface2);color:var(--ink2);font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.rolechip.admin{background:var(--accent-soft);color:var(--accent)}
.people{overflow:hidden;border:1px solid var(--line);border-radius:12px}
.person{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.person p{margin:0;font-size:13.5px;font-weight:500}
.person>div>span{display:block;font-size:12px;color:var(--muted)}
.person select{height:32px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12.5px}
.person select:disabled{opacity:.5}
.stat{padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.stat p{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}

/* drop overlay + toast tone ------------------------------------------- */
body.dropping::after{
  content:"Drop to add — PDF or PPTX";
  position:fixed;inset:0;z-index:70;display:grid;place-items:center;
  background:color-mix(in oklab,var(--accent) 10%,transparent);backdrop-filter:blur(2px);
  font-size:15px;font-weight:600;color:var(--accent);pointer-events:none;
  outline:2px dashed var(--accent);outline-offset:-16px;
}
.toast .ic.bad{background:color-mix(in oklab,var(--danger) 14%,transparent);color:var(--danger)}
.field{display:block;margin-bottom:14px}
.field>span{display:block;margin-bottom:6px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.inp{width:100%;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13.5px;outline:0}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 16%,transparent)}
</style>
</head>
