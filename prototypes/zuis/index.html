function ingestHTML() {
  const g = S.ingest;
  const pct = g.total ? Math.round((g.done / g.total) * 100) : 8;
  return `<div class="backdrop"><div class="modal" data-stop style="max-width:400px">
    <div class="mbody" style="padding:22px">
      <p style="margin:0;font-size:14px;font-weight:600">Rendering ${esc(g.name)}</p>
      <p style="margin:4px 0 0;font-size:12.5px;color:var(--muted)">${g.phase === 'reading' ? 'Reading the file…' : `Slide ${g.done} of ${g.total}`}</p>
      <div class="prog"><i style="width:${pct}%"></i></div>
    </div>
  </div></div>`;
}

function modalHTML() {
  const m = S.modal;
  const shell = (title, sub, body, foot) => `<div class="backdrop" data-act="closemodal"><div class="modal" data-stop>
    <header><div style="flex:1"><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>
      <button class="iconbtn" data-act="closemodal" aria-label="Close">${ic.x}</button></header>
    <div class="mbody">${body}</div><footer>${foot}</footer></div></div>`;

  if (m.kind === 'newcoll') {
    return shell('Create collection', 'Group related presentations so they are easy to find later.',
      `<label class="field"><span>Name</span><input class="inp" id="cname" placeholder="e.g. Q4 Planning" autofocus></label>
       <div class="field"><span>Accent</span><div style="display:flex;gap:8px">
         ${TAG_COLORS.map((c, i) => `<button data-accent="${c}" aria-label="Accent ${i + 1}" style="width:26px;height:26px;border-radius:9px;background:${c};${i === 0 ? 'outline:2px solid var(--accent);outline-offset:2px' : ''}"></button>`).join('')}
       </div></div>`,
      `<button class="btn" data-act="closemodal">Cancel</button><button class="btn pri" data-act="createcoll">Create</button>`);
  }
  if (m.kind === 'rename') {
    const d = byId(m.id);
    return shell('Rename presentation', `File: ${esc(d.file)}`,
      `<label class="field" style="margin:0"><span>Title</span><input class="inp" id="rname" value="${esc(d.title)}" autofocus></label>`,
      `<button class="btn" data-act="closemodal">Cancel</button><button class="btn pri" data-act="dorename">Save</button>`);
  }
  if (m.kind === 'tags') {
    const d = byId(m.id);
    return shell('Tags', esc(d.title),
      `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${d.tags.length ? d.tags.map((t) => `<span class="pill">${esc(t)}<span role="button" data-untag="${esc(t)}" style="cursor:pointer;margin-left:2px;color:var(--muted)">${I('<path d="M6 6l12 12M18 6 6 18"/>', 10)}</span></span>`).join('') : '<span style="font-size:12.5px;color:var(--muted)">No tags yet</span>'}</div>
       <label class="field" style="margin:0"><span>Add a tag</span><input class="inp" id="tagin" placeholder="Type and press Enter" autofocus></label>`,
      `<button class="btn pri" data-act="closemodal">Done</button>`);
  }
  if (m.kind === 'move') {
    const d = byId(m.id);
    return shell('Move to collection', `Choose where “${esc(d.title)}” belongs.`,
      `<div class="scroll" style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:3px">
        ${[{ id: '', name: 'No collection', accent: 'var(--muted)' }, ...collections].map((c) => `<button class="opt" data-movec="${c.id}" style="${(d.collection ?? '') === c.id ? 'background:var(--accent-soft);color:var(--accent)' : ''}">
          <span class="dot" style="background:${c.accent}"></span><span style="flex:1">${esc(c.name)}</span>
          ${(d.collection ?? '') === c.id ? ic.check : ''}</button>`).join('')}
        ${collections.length ? '' : '<p style="margin:6px 2px;font-size:12.5px;color:var(--muted)">No collections yet — create one first.</p>'}
      </div>`, `<button class="btn" data-act="closemodal">Close</button>`);
  }
  return '';
}

function panelHTML() {
  const d = byId(S.panel);
  const c = collections.find((x) => x.id === d.collection);
  const rowD = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
  const act = (icon, l, a, dngr) => `<button class="pact${dngr ? ' dngr' : ''}" data-act="${a}">${icon}${l}</button>`;
  return `<div class="sheet"><div class="veil" data-act="closepanel"></div><aside class="panel">
    <header><b>Details</b><button class="iconbtn" data-act="closepanel" aria-label="Close details">${ic.x}</button></header>
    <div class="pbody scroll">
      <div style="border:1px solid var(--line);border-radius:12px;overflow:hidden">${shotOf(d)}</div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <h2 style="flex:1;margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.35">${esc(d.title)}</h2>
        <button data-fav="${d.id}" aria-label="Favorite" style="color:${myFav(d) ? 'var(--star)' : 'var(--muted)'}">${starFill(myFav(d))}</button>
      </div>
      ${d.tags.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px">${d.tags.map((t) => tagPill(t)).join('')}</div>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px">
        <button class="btn pri" data-open="${d.id}">${ic.play} Open</button>
        <button class="btn" data-download="${d.id}">${ic.download} Download</button></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <dl class="dl">
        ${rowD('File name', `<span class="mono" style="font-size:12px">${esc(d.file)}</span>`)}
        ${rowD('File type', `<span class="type t-${d.type}">${d.type.toUpperCase()}</span>`)}
        ${rowD('File size', size(d.size))}
        ${rowD('Slides', `<span class="num">${d.slides.length}</span>`)}
        ${rowD('Author', esc(d.author ?? '—'))}
        ${rowD('Collection', c ? esc(c.name) : '—')}
        ${rowD('Added', fullD(d.created))}
        ${rowD('Last opened', myProg(d).opened ? `${rel(myProg(d).opened)} · slide ${myProg(d).slide}` : 'Never')}
        ${rowD('Preview', d.renderer === 'pdf' ? 'Rendered from the PDF' : 'Rendered from the PowerPoint file')}
      </dl>
    </div>
    ${isAdmin() ? `<footer>
      ${act(ic.pencil, 'Rename', 'p-rename')}${act(ic.move, 'Move', 'p-move')}
      ${act(ic.tag, 'Tags', 'p-tags')}${act(ic.copy, 'Duplicate', 'p-dup')}
      ${act(ic.trash, 'Trash', 'p-trash', true)}
    </footer>` : ''}
  </aside></div>`;
}

function menuHTML() {
  const { x, y, id } = S.menu, d = byId(id);
  const item = (icon, l, a, dngr, hr) => `${hr ? '<hr>' : ''}<button class="${dngr ? 'dngr' : ''}" data-mact="${a}"><span class="mi">${icon}</span>${l}</button>`;
  let body;
  if (d.trashed) {
    body = item(ic.undo, 'Restore', 'restore') + item(ic.x, 'Delete permanently', 'destroy', true, true);
  } else {
    body = item(ic.play, 'Open', 'open')
      + item(ic.star, myFav(d) ? 'Remove from favorites' : 'Add to favorites', 'fav', false, true)
      + item(ic.info, 'Presentation info', 'info')
      + item(ic.download, 'Download', 'download');
    if (isAdmin()) {
      body += item(ic.move, 'Move to collection…', 'move', false, true)
        + item(ic.tag, 'Tags…', 'tags')
        + item(ic.pencil, 'Rename…', 'rename')
        + item(ic.copy, 'Duplicate', 'dup')
        + item(ic.trash, 'Move to Trash', 'trash', true, true);
    }
  }
  return `<div class="menu" style="left:${x}px;top:${y}px" role="menu">${body}</div>`;
}

/* =============================== render ================================ */

const themePref = () => document.documentElement.dataset.theme
  || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

const SCREENS = {
  home: screenHome, library: screenLibrary, recent: screenRecent, favorites: screenFavorites,
  collections: screenCollections, collection: screenCollection, tags: screenTags,
  trash: screenTrash, settings: screenSettings, search: screenSearch, dashboard: screenDashboard,
};

function render() {
  const app = document.getElementById('app');
  if (!S.user) {
    app.innerHTML = screenLogin();
    document.getElementById('layer').innerHTML = '';
    return;
  }
  app.innerHTML = S.viewer ? '' : `${sidebarHTML()}
    <div class="main">${topHTML()}
      <div class="content scroll" id="content"><div class="wrap">${(SCREENS[S.route] || screenHome)()}</div></div>
      <div class="hintbar">${I('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>', 13)}
        <span>${isAdmin()
          ? 'Drop a PDF or .pptx anywhere to add it — it renders in your browser. <b>←</b> <b>→</b> move through slides, <b>T</b> thumbnails, <b>G</b> grid.'
          : 'Signed in as a viewer: browse, search inside slides, present. Only admins can add presentations.'}</span></div>
    </div>`;

  const layer = document.getElementById('layer');
  layer.innerHTML = (S.viewer ? viewerHTML() : '') + (S.ingest ? ingestHTML() : '')
    + (S.upload ? uploadHTML() : '') + (S.modal ? modalHTML() : '')
    + (S.panel ? panelHTML() : '') + (S.menu ? menuHTML() : '');

  if (S.menu) {
    const el = layer.querySelector('.menu'), r = el.getBoundingClientRect();
    el.style.left = Math.max(8, Math.min(S.menu.x, innerWidth - r.width - 12)) + 'px';
    el.style.top = Math.max(8, Math.min(S.menu.y, innerHeight - r.height - 12)) + 'px';
  }
  const q = document.getElementById('q');
  if (q && S.focusQ) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); S.focusQ = false; }
  layer.querySelector('.vrail .list2 button.on')?.scrollIntoView({ block: 'nearest' });
  const tagin = document.getElementById('tagin');
  if (tagin) tagin.focus();
}

let seq = 0;
function toast(msg, undo, kind) {
  const id = 't' + (++seq);
  const el = document.createElement('div');
  el.className = 'toast'; el.id = id;
  el.innerHTML = `<span class="ic${kind === 'error' ? ' bad' : ''}">${kind === 'error' ? I('<path d="M12 9v4M12 17h.01"/><path d="M10.3 4.3 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0Z"/>', 13) : I('<path d="m5 12.5 4.5 4.5L19 7"/>', 13)}</span>
    <p>${esc(msg)}</p>${undo ? `<button class="undo" data-undo="${id}">Undo</button>` : ''}
    <button class="iconbtn" style="width:24px;height:24px" data-closetoast="${id}" aria-label="Dismiss">${I('<path d="M6 6l12 12M18 6 6 18"/>', 13)}</button>`;
  el._undo = undo;
  document.getElementById('toasts').append(el);
  setTimeout(() => el.remove(), 5200);
}

/* =============================== actions =============================== */

let beat = 0;
function openDeck(id) {
  const d = byId(id);
  const prog = progOf(S.user.id, id);
  S.resume = prog.slide > 1 ? prog.slide : null;
  prog.opened = Date.now();
  prog.opens++;
  logEvent('open', { deckId: id });
  S.viewer = { id, i: 0, rail: false, grid: false, zoom: 1 };
  S.menu = S.panel = null;
  clearInterval(beat);
  beat = setInterval(() => {
    if (!S.viewer || document.hidden) return;
    progOf(S.user.id, S.viewer.id).seconds += 15;
  }, 15000);
  markSlide(id, 1);
  render();
}
/** Furthest slide reached decides progress, and the last slide means finished. */
function markSlide(deckId, slide) {
  const d = byId(deckId);
  const prog = progOf(S.user.id, deckId);
  prog.slide = slide;
  prog.maxSlide = Math.max(prog.maxSlide, slide);
  if (!prog.completedAt && prog.maxSlide >= d.slides.length) {
    prog.completedAt = Date.now();
    logEvent('complete', { deckId });
  }
}
function nav(step) {
  const v = S.viewer, d = byId(v.id);
  v.i = Math.max(0, Math.min(d.slides.length - 1, v.i + step));
  markSlide(d.id, v.i + 1);
  v.zoom = 1;
  render();
}
function go(route, arg) {
  S.route = route; S.arg = arg ?? null; S.qOpen = false; S.filter = null; S.sortOpen = false;
  document.getElementById('content')?.scrollTo(0, 0);
  render();
}
function pickFiles() {
  const input = document.createElement('input');
  input.type = 'file'; input.multiple = true; input.accept = ACCEPT;
  input.onchange = () => stageFiles(input.files);
  input.click();
}

/** Files wait in the dialog until the person presses Add — nothing renders yet. */
function stageFiles(list) {
  const incoming = [...list].filter((f) => ACCEPT.includes('.' + extOf(f.name)));
  const skipped = [...list].length - incoming.length;
  if (skipped) toast(`${skipped} file${skipped === 1 ? '' : 's'} skipped — the prototype reads PDF and .pptx`, null, 'error');
  if (!incoming.length) return render();
  S.upload = S.upload ?? { collection: null, files: [] };
  S.upload.files = [...(S.upload.files ?? []), ...incoming.filter((f) => !(S.upload.files ?? []).some((x) => x.name === f.name && x.size === f.size))];
  render();
}
function downloadDeck(d) {
  logEvent('download', { deckId: d.id });
  // No original file in the prototype, so hand over the rendered slide.
  const a = document.createElement('a');
  a.href = d.slides[S.viewer?.id === d.id ? S.viewer.i : 0].img;
  a.download = `${d.title.replace(/[^\w -]/g, '')}.jpg`;
  a.click();
  toast('The prototype exports the rendered slide; the real app returns the original file.');
}

document.addEventListener('submit', async (e) => {
  if (!e.target.matches('[data-login]')) return;
  e.preventDefault();
  const fd = new FormData(e.target);
  const name = String(fd.get('name') || '');
  const email = String(fd.get('email') || '').trim().toLowerCase();
  const password = String(fd.get('password') || '');
  const confirm = String(fd.get('confirm') || '');
  const creating = USERS.length === 0 || S.login.mode === 'signup';

  const fail = (msg) => { S.login = { ...S.login, name, email, password: '', confirm: '', error: msg, busy: false }; render(); };
  if (creating && password !== confirm) return fail('Those two passwords do not match');

  S.login = { ...S.login, name, email, error: null, busy: true };
  render();
  try {
    const u = creating ? await createAccount({ name, email, password }) : await signIn(email, password);
    startSession(u);
  } catch (err) {
    fail(err instanceof Error ? err.message : 'Something went wrong');
  }
});

/** Sign someone in and remember them for next time. */
function startSession(u) {
  S.user = u;
  store.set(SESSION_KEY, u.id);
  S.login = { mode: 'signin', name: '', email: '', password: '', confirm: '', error: null, busy: false };
  S.route = 'home';
  render();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-go],[data-open],[data-fav],[data-menu],[data-coll],[data-view],[data-sort],[data-tag],[data-jump],[data-nav],[data-zoom],[data-mact],[data-info],[data-theme],[data-ftype],[data-fcoll],[data-ftag],[data-ffav],[data-fclear],[data-movec],[data-undo],[data-closetoast],[data-accent],[data-mode],[data-untag],[data-delcoll],[data-download],[data-unstage],[data-stop]');
  if (!t) {
    if (S.menu) { S.menu = null; render(); }
    if ((S.filter || S.sortOpen || S.qOpen) && !e.target.closest('[data-keep],.searchbox')) { S.filter = null; S.sortOpen = false; S.qOpen = false; render(); }
    return;
  }
  if (t.dataset.stop !== undefined) return;
  const d = t.dataset;

  if (d.undo) { const el = document.getElementById(d.undo); el?._undo?.(); el?.remove(); return; }
  if (d.closetoast) { document.getElementById(d.closetoast)?.remove(); return; }
  if (d.mode) { S.login = { ...S.login, mode: d.mode, password: '', confirm: '', error: null }; return render(); }
  if (d.go) return go(d.go);
  if (d.coll) return go('collection', d.coll);
  if (d.open) return openDeck(d.open);
  if (d.download) return downloadDeck(byId(d.download));
  if (d.info) { S.panel = d.info; S.menu = null; return render(); }
  if (d.jump !== undefined) { S.viewer.i = +d.jump; S.viewer.grid = false; markSlide(S.viewer.id, +d.jump + 1); return render(); }
  if (d.nav) return nav(+d.nav);
  if (d.zoom) { const z = [1, 1.25, 1.5, 2, 2.5]; S.viewer.zoom = z[Math.max(0, Math.min(z.length - 1, z.indexOf(S.viewer.zoom) + +d.zoom))]; return render(); }
  if (d.view) { S.view = d.view; return render(); }
  if (d.sort) { S.sort = d.sort; S.sortOpen = false; return render(); }
  if (d.theme) { document.documentElement.dataset.theme = d.theme; return render(); }
  if (d.tag !== undefined) { S.tag = d.tag || null; return S.route === 'tags' ? render() : go('tags'); }
  if (d.accent) { [...t.parentElement.children].forEach((b) => (b.style.outline = '')); t.style.outline = '2px solid var(--accent)'; t.style.outlineOffset = '2px'; return; }
  if (d.unstage) { S.upload.files.splice(+d.unstage, 1); return render(); }
  if (d.untag) { const deck = byId(S.modal.id); deck.tags = deck.tags.filter((x) => x !== d.untag); return render(); }
  if (d.delcoll) {
    const i = collections.findIndex((c) => c.id === d.delcoll);
    const [c] = collections.splice(i, 1);
    decks.forEach((x) => { if (x.collection === c.id) x.collection = null; });
    toast(`Collection “${c.name}” deleted`);
    return go('collections');
  }

  if (d.fav !== undefined) {
    const st = stateOf(S.user.id);
    st.fav.has(d.fav) ? st.fav.delete(d.fav) : st.fav.add(d.fav);
    toast(st.fav.has(d.fav) ? 'Added to your favorites' : 'Removed from your favorites');
    return render();
  }
  if (d.menu !== undefined) {
    const r = t.getBoundingClientRect();
    S.menu = { x: r.left, y: r.bottom + 6, id: d.menu };
    return render();
  }
  if (d.ftype !== undefined) { S.filter.type = S.filter.type === d.ftype ? null : d.ftype; return render(); }
  if (d.fcoll !== undefined) { S.filter.coll = S.filter.coll === d.fcoll ? null : d.fcoll; return render(); }
  if (d.ftag !== undefined) { S.filter.tag = S.filter.tag === d.ftag ? null : d.ftag; return render(); }
  if (d.ffav !== undefined) { S.filter.fav = !S.filter.fav; return render(); }
  if (d.fclear !== undefined) { S.filter = S.filter ? {} : null; return render(); }
  if (d.movec !== undefined) {
    const deck = byId(S.modal.id);
    deck.collection = d.movec || null;
    S.modal = null;
    toast(d.movec ? `Moved to ${collections.find((c) => c.id === d.movec).name}` : 'Removed from collection');
    return render();
  }

  if (d.mact) {
    const id = S.menu.id, deck = byId(id);
    S.menu = null;
    switch (d.mact) {
      case 'open': return openDeck(id);
      case 'fav': { const st = stateOf(S.user.id); st.fav.has(id) ? st.fav.delete(id) : st.fav.add(id); return render(); }
      case 'info': S.panel = id; return render();
      case 'download': return downloadDeck(deck);
      case 'move': S.modal = { kind: 'move', id }; return render();
      case 'tags': S.modal = { kind: 'tags', id }; return render();
      case 'rename': S.modal = { kind: 'rename', id }; return render();
      case 'dup': decks.unshift({ ...deck, id: uid(), title: deck.title + ' (copy)', created: Date.now() }); toast('Duplicated'); return render();
      case 'trash': deck.trashed = true; toast(`“${deck.title}” moved to Trash`, () => { deck.trashed = false; render(); }); return render();
      case 'restore': deck.trashed = false; toast('Restored'); return render();
      case 'destroy': decks.splice(decks.indexOf(deck), 1); toast('Deleted permanently'); return render();
    }
  }

  switch (d.act) {
    case 'collapse': S.sidebar = !S.sidebar; return render();
    case 'theme': document.documentElement.dataset.theme = themePref() === 'dark' ? 'light' : 'dark'; return render();
    case 'logout':
      store.drop(SESSION_KEY);
      S.user = null; S.viewer = S.panel = S.modal = S.upload = null; S.q = '';
      return render();
    case 'upload': S.upload = { collection: t.dataset.into ?? null, files: [] }; return render();
    case 'pick': return pickFiles();
    case 'commit': {
      const { files, collection } = S.upload;
      S.upload = null;
      return void ingestFiles(files, { collection });
    }
    case 'closemodal': S.modal = null; S.upload = null; return render();
    case 'closepanel': S.panel = null; return render();
    case 'newcoll': S.modal = { kind: 'newcoll', accent: TAG_COLORS[0] }; return render();
    case 'createcoll': {
      const name = (document.getElementById('cname')?.value || '').trim() || 'Untitled collection';
      const accent = document.querySelector('[data-accent][style*="outline"]')?.dataset.accent ?? TAG_COLORS[0];
      collections.push({ id: uid(), name, desc: '', accent });
      S.modal = null; toast(`Collection “${name}” created`); return render();
    }
    case 'dorename': {
      const v = (document.getElementById('rname')?.value || '').trim();
      if (v) { byId(S.modal.id).title = v; toast('Renamed'); }
      S.modal = null; return render();
    }
    case 'clearall': decks.length = 0; collections.length = 0; Object.keys(perUser).forEach((k) => delete perUser[k]); toast('Library cleared'); return go('home');
    case 'empty': decks.filter((x) => x.trashed).forEach((x) => decks.splice(decks.indexOf(x), 1)); toast('Trash emptied'); return render();
    case 'filter': S.filter = S.filter ? null : {}; S.sortOpen = false; return render();
    case 'sort': S.sortOpen = !S.sortOpen; S.filter = null; return render();
    case 'clearq': S.q = ''; S.qOpen = false; return S.route === 'search' ? go('library') : render();
    case 'seeall': S.qOpen = false; return go('search');
    case 'closeviewer': S.viewer = null; S.resume = null; S.keys = false; clearInterval(beat); return render();
    case 'vrail': S.viewer.rail = !S.viewer.rail; S.viewer.grid = false; return render();
    case 'vgrid': S.viewer.grid = !S.viewer.grid; return render();
    case 'keys': S.keys = true; return render();
    case 'closekeys': S.keys = false; return render();
    case 'resume': S.viewer.i = S.resume - 1; markSlide(S.viewer.id, S.resume); S.resume = null; return render();
    case 'restart': S.viewer.i = 0; S.resume = null; markSlide(S.viewer.id, 1); return render();
    case 'p-rename': S.modal = { kind: 'rename', id: S.panel }; S.panel = null; return render();
    case 'p-move': S.modal = { kind: 'move', id: S.panel }; S.panel = null; return render();
    case 'p-tags': S.modal = { kind: 'tags', id: S.panel }; S.panel = null; return render();
    case 'p-dup': { const deck = byId(S.panel); decks.unshift({ ...deck, id: uid(), title: deck.title + ' (copy)', created: Date.now() }); S.panel = null; toast('Duplicated'); return render(); }
    case 'p-trash': { const deck = byId(S.panel); deck.trashed = true; S.panel = null; toast(`“${deck.title}” moved to Trash`, () => { deck.trashed = false; render(); }); return render(); }
    case 'fs': {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => toast('Fullscreen was blocked by the browser'));
      else document.exitFullscreen?.();
      return;
    }
  }
});

document.addEventListener('change', (e) => {
  const sel = e.target.closest('[data-role]');
  if (!sel) return;
  const u = USERS.find((x) => x.id === sel.dataset.role);
  u.role = sel.value;
  saveAccounts();
  toast(`${u.name} is now ${u.role}`);
  render();
});

document.addEventListener('contextmenu', (e) => {
  const c = e.target.closest('[data-open]');
  if (!c || !S.user) return;
  e.preventDefault();
  S.menu = { x: e.clientX, y: e.clientY, id: c.dataset.open };
  render();
});

let searchTimer = 0;
document.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  S.q = e.target.value; S.qOpen = true; S.focusQ = true;
  clearTimeout(searchTimer);
  const q = S.q.trim();
  if (q.length > 1) searchTimer = setTimeout(() => logEvent('search', { query: q.toLowerCase() }), 900);
  render();
});

document.addEventListener('keydown', (e) => {
  if (!S.user) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.target.id === 'tagin' && e.key === 'Enter') {
    e.preventDefault();
    const v = e.target.value.trim();
    if (v) { const deck = byId(S.modal.id); if (!deck.tags.includes(v)) deck.tags.push(v); }
    return render();
  }
  if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) {
    e.preventDefault(); S.qOpen = true; S.focusQ = true; if (S.viewer) S.viewer = null; return render();
  }
  if (typing) {
    if (e.key === 'Enter' && e.target.id === 'q' && S.q.trim()) { S.qOpen = false; go('search'); }
    if (e.key === 'Escape' && e.target.id === 'q') { S.qOpen = false; render(); }
    return;
  }
  if (e.key === '/') { e.preventDefault(); S.qOpen = true; S.focusQ = true; return render(); }
  if (!S.viewer) return;
  const n = byId(S.viewer.id).slides.length;
  switch (e.key) {
    case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); return nav(1);
    case 'ArrowLeft': case 'PageUp': e.preventDefault(); return nav(-1);
    case 'Home': e.preventDefault(); S.viewer.i = 0; markSlide(S.viewer.id, 1); return render();
    case 'End': e.preventDefault(); S.viewer.i = n - 1; markSlide(S.viewer.id, n); return render();
    case 't': case 'T': S.viewer.rail = !S.viewer.rail; S.viewer.grid = false; return render();
    case 'g': case 'G': S.viewer.grid = !S.viewer.grid; return render();
    case 'f': case 'F': document.fullscreenElement ? document.exitFullscreen?.() : document.documentElement.requestFullscreen?.().catch(() => {}); return;
    case '+': case '=': { const z = [1, 1.25, 1.5, 2, 2.5]; S.viewer.zoom = z[Math.min(z.length - 1, z.indexOf(S.viewer.zoom) + 1)]; return render(); }
    case '-': case '_': { const z = [1, 1.25, 1.5, 2, 2.5]; S.viewer.zoom = z[Math.max(0, z.indexOf(S.viewer.zoom) - 1)]; return render(); }
    case '?': S.keys = !S.keys; return render();
    case 'Escape':
      if (S.keys) { S.keys = false; return render(); }
      if (document.fullscreenElement) return document.exitFullscreen?.();
      S.viewer = null; S.resume = null; clearInterval(beat); return render();
    default:
      if (/^[1-9]$/.test(e.key)) { S.viewer.i = Math.min(n - 1, +e.key - 1); markSlide(S.viewer.id, S.viewer.i + 1); return render(); }
  }
});

/* window-wide drag and drop — admins only */
let dragDepth = 0;
const hasFiles = (e) => [...(e.dataTransfer?.types ?? [])].includes('Files');
addEventListener('dragenter', (e) => { if (S.user && isAdmin() && hasFiles(e)) { dragDepth++; document.body.classList.add('dropping'); } });
addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dropping'); });
addEventListener('dragover', (e) => { if (S.user && isAdmin() && hasFiles(e)) e.preventDefault(); });
addEventListener('drop', (e) => {
  if (!S.user || !isAdmin() || !hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dropping');
  S.upload = S.upload ?? { collection: null, files: [] };
  stageFiles(e.dataTransfer.files);
});

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!document.documentElement.dataset.theme) render(); });

/* With sign-in off, everyone is the owner. Otherwise: still signed in from last time? */
if (!AUTH_ENABLED) {
  S.user = USERS.find((u) => u.owner)
    ?? { id: 'u_local', name: 'Gopinath T', email: OWNER_EMAIL, role: 'admin', owner: true };
} else {
  const remembered = USERS.find((u) => u.id === store.get(SESSION_KEY, null));
  if (remembered) S.user = remembered;
}
render();

</script>
