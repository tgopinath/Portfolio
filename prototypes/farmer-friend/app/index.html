<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FarmerFriend</title>
  <meta name="description" content="What to plant this season, how to grow every crop, and how to make organic compost at home.">
  <meta name="theme-color" content="#F4F1E8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151A15" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FarmerFriend">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&family=Noto+Serif+Tamil:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-sprout" viewBox="0 0 24 24"><path d="M12 21v-9"/><path d="M12 12C12 7.5 8.5 5 4 5c0 4.5 3.5 7 8 7Z"/><path d="M12 14c0-4 3-6.5 8-6.5 0 4-3 6.5-8 6.5Z"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1Z"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
      <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19c3-4 6-6.5 9-8"/></symbol>
      <symbol id="i-recycle" viewBox="0 0 24 24"><path d="M12 20c-4.4 0-8-3.6-8-8"/><path d="M4 12c0-4.4 3.6-8 8-8 2.3 0 4.3.9 5.8 2.5"/><path d="M18 3v4h-4"/><path d="M20 12c0 4.4-3.6 8-8 8"/><path d="M8.5 15.5c1-2.8 3.5-5 7-5.5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.5s6 6.3 6 10.5a6 6 0 0 1-12 0c0-4.2 6-10.5 6-10.5Z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7 10a4.25 4.25 0 0 0 0 8.5Z"/></symbol>
      <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 15h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7 6.5a4.25 4.25 0 0 0 0 8.5Z"/><path d="M8 18l-1 2.5M12 18l-1 2.5M16 18l-1 2.5"/></symbol>
      <symbol id="i-storm" viewBox="0 0 24 24"><path d="M7 15h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7 6.5a4.25 4.25 0 0 0 0 8.5Z"/><path d="m12.5 15-2 3.5h3l-2 3.5"/></symbol>
      <symbol id="i-fog" viewBox="0 0 24 24"><path d="M4 9h16M6 13h12M4 17h16"/></symbol>
      <symbol id="i-temp" viewBox="0 0 24 24"><path d="M10 14.5V5a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0Z"/><path d="M12 9v7"/></symbol>
      <symbol id="i-wind" viewBox="0 0 24 24"><path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h7"/></symbol>
      <symbol id="i-bug" viewBox="0 0 24 24"><rect x="8" y="7" width="8" height="12" rx="4"/><path d="M12 7v12M9.5 4.5 11 7M14.5 4.5 13 7M4 11h4M16 11h4M4.5 17l3.5-1.5M19.5 17 16 15.5"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4Z"/><path d="M12 10v4M12 17h.01"/></symbol>
      <symbol id="i-scale" viewBox="0 0 24 24"><path d="M12 4v16M6 20h12M5 8h14"/><path d="m5 8-2.5 6a3 3 0 0 0 5 0Zm14 0-2.5 6a3 3 0 0 0 5 0Z"/></symbol>
      <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22"/></symbol>
      <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9.5 3.5h5M10.5 3.5V9L5 18.5A1.5 1.5 0 0 0 6.3 20.5h11.4a1.5 1.5 0 0 0 1.3-2L13.5 9V3.5"/><path d="M7.5 15h9"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 5 6v5.5c0 4.5 3 7.7 7 9 4-1.3 7-4.5 7-9V6Z"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 4 9 4.5-9 4.5-9-4.5Z"/><path d="m3 13 9 4.5 9-4.5"/></symbol>
      <symbol id="i-worm" viewBox="0 0 24 24"><path d="M3.5 15c2 0 2-4 4.25-4S9.75 15 12 15s2-4 4.25-4 2 4 4.25 4"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5Z" fill="currentColor"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="FarmerFriend home">
      <span class="brand-mark"><svg><use href="#i-sprout"/></svg></span>
      <span class="brand-name">FarmerFriend</span>
    </a>
    <nav class="tabs" aria-label="Main">
      <a href="#/" data-tab="home"><svg><use href="#i-home"/></svg><span data-i18n="tabs.home">Today</span></a>
      <a href="#/seasons" data-tab="seasons"><svg><use href="#i-calendar"/></svg><span data-i18n="tabs.seasons">Seasons</span></a>
      <a href="#/crops" data-tab="crops"><svg><use href="#i-leaf"/></svg><span data-i18n="tabs.crops">Crops</span></a>
      <a href="#/compost" data-tab="compost"><svg><use href="#i-recycle"/></svg><span data-i18n="tabs.compost">Organic</span></a>
    </nav>
    <button class="lang-btn" id="langBtn" type="button" lang="ta" aria-label="Switch to Tamil">தமிழ்</button>
    <button class="place-btn" id="placeBtn" type="button"><svg><use href="#i-pin"/></svg><span id="placeName">Chennai</span></button>
  </header>

  <main id="app" tabindex="-1"></main>

  <dialog id="placeDialog" class="sheet">
    <form method="dialog" class="sheet-inner" id="placeForm">
      <div class="sheet-head">
        <h2 data-i18n="placeTitle">Your farm location</h2>
        <button class="icon-btn" value="cancel" aria-label="Close"><svg><use href="#i-x"/></svg></button>
      </div>
      <p class="muted" data-i18n="placeNote">Used only for the local weather forecast.</p>
      <button type="button" class="btn btn-outline wide" id="locateBtn"><svg><use href="#i-locate"/></svg><span data-i18n="useLoc">Use my current location</span></button>
      <label class="field">
        <span data-i18n="searchPlace">Or search a town or district</span>
        <input id="placeInput" type="search" placeholder="e.g. Thanjavur, Nashik, Ludhiana" data-i18n-ph="placePh" autocomplete="off">
      </label>
      <ul class="place-results" id="placeResults"></ul>
    </form>
  </dialog>

  <dialog id="lightbox" class="lightbox" aria-label="Photo">
    <form method="dialog"><button class="icon-btn lb-close" aria-label="Close"><svg><use href="#i-x"/></svg></button></form>
    <figure><img id="lbImg" alt=""><figcaption><b id="lbCap"></b><small id="lbCredit"></small></figcaption></figure>
    <button type="button" class="icon-btn lb-nav lb-prev" id="lbPrev" data-i18n-aria="prev"><svg><use href="#i-back"/></svg></button>
    <button type="button" class="icon-btn lb-nav lb-next" id="lbNext" data-i18n-aria="next"><svg><use href="#i-next"/></svg></button>
    <span class="lb-count" id="lbCount"></span>
  </dialog>

  <script src="images.js"></script>
  <script src="media.js"></script>
  <script src="media-inputs.js"></script>
  <script src="videos.js"></script>
  <script src="media-more-1.js"></script>
  <script src="media-more-2.js"></script>
  <script src="videos-more.js"></script>
  <script src="captions-ta.js"></script>
  <script src="data-crops.js"></script>
  <script src="data-crops-more-1.js"></script>
  <script src="data-crops-more-2.js"></script>
  <script src="data-crops-more-3.js"></script>
  <script src="data-crops-more-4.js"></script>
  <script src="images-local.js"></script>
  <script src="data-compost.js"></script>
  <script src="sources.js"></script>
  <script src="data-ta-crops-1.js"></script>
  <script src="data-ta-crops-2.js"></script>
  <script src="data-ta-compost.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
