<meta charset="utf-8">
<title>Ulaa Browser Modes</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Caveat:wght@500&display=swap">
<style>
:root{color-scheme:dark;--ground:#14161a;--ground-text:#c9ced6;--ground-muted:#8a919c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ground-text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Lato,sans-serif;overflow:hidden}
.hintbar{flex:none;display:flex;align-items:center;justify-content:center;gap:6px 18px;flex-wrap:wrap;padding:8px 16px;font-size:12px;color:var(--ground-muted);text-align:center}
.hintbar b{color:var(--ground-text);font-weight:600}
.viewport{position:fixed;inset:0}
#win{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;overflow:hidden;font-family:Lato,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--fg);background:var(--pg)}

/* ---------- mode palettes ---------- */
#win{--menubar:#dcdde2;--menubar-fg:#1d1d1f;transition:background .35s}
#win[data-mode=open]{--tabbar:#e1e2e6;--tab:#fff;--tab-fg:#1d1d1f;--tb:#fff;--addr:#f7f8fa;--addr-line:#e3e4e8;--addr-fg:#5d6068;--icon:#1d1d1f;--pill:#fff;--pill-line:#c9cace;--pill-fg:#1d1d1f;--pg:#f5f5f5;--blob:#ececec;--fg:#000;--title:#000;--accent:#000;--muted:#555;--on:#7fb2f0}
#win[data-mode=incognito]{--tabbar:#070f27;--tab:#1c2a53;--tab-fg:#fff;--tb:#1c2a53;--addr:#070f27;--addr-line:#596ea9;--addr-fg:#c9d0e4;--icon:#e6e9f2;--pill:#070f27;--pill-line:#070f27;--pill-fg:#fff;--pg:#121f44;--blob:#16244d;--fg:#fff;--title:#fff;--accent:#fff;--muted:#c9d0e4;--on:#7d8fc4}
#win[data-mode=personal]{--tabbar:#fff0da;--tab:#f9c977;--tab-fg:#1d1d1f;--tb:#f9c977;--addr:#fff;--addr-line:#fff6d2;--addr-fg:#5d6068;--icon:#1d1d1f;--pill:#fff0da;--pill-line:#fff0da;--pill-fg:#1d1d1f;--pg:#fde8c2;--blob:#fbe0b0;--fg:#000;--title:#000;--accent:#000;--muted:#5a4a2a;--on:#f2b24a}
#win[data-mode=work]{--tabbar:#c2d4d1;--tab:#097862;--tab-fg:#fff;--tb:#097862;--addr:#055848;--addr-line:#055546;--addr-fg:#d2ece6;--icon:#e8f5f2;--pill:#034337;--pill-line:#034337;--pill-fg:#fff;--pg:#21a48b;--blob:#1f9b83;--fg:#fff;--title:#fff;--accent:#fff;--muted:#e0f3ee;--on:#7fd3c1}
#win[data-mode=developer]{--tabbar:#a6acb3;--tab:#33495d;--tab-fg:#fff;--tb:#33495d;--addr:#233244;--addr-line:#24384b;--addr-fg:#cfd6de;--icon:#e1e6ec;--pill:#253146;--pill-line:#253146;--pill-fg:#fff;--pg:#44586a;--blob:#3f5263;--fg:#fff;--title:#fff;--accent:#fff;--muted:#d6dde4;--on:#8aa3bb}
#win[data-mode=kids]{--addr-line:#e8a917;--pill-line:#f7c55a;--on:#f2b24a;--tabbar:#fbd994;--tab:#fdebc4;--tab-fg:#3a2a05;--tb:#fdebc4;--addr:#fff6e1;--addr-fg:#6b5420;--icon:#6b5420;--pill:#f7c55a;--pill-fg:#3a2a05;--pg:#fde9c4;--blob:#fbdba0;--fg:#1d1d1f;--title:#d39a14;--accent:#c98a00;--muted:#5c4a22}
#win.dark{--pg:#1f2023;--blob:#2a2b2f;--fg:#fff;--title:#fff;--accent:#fff;--muted:#c8c8c8}
#win.has-bg{--fg:#fff;--title:#fff;--accent:#fff;--muted:#f1ece4}

/* ---------- mac menu bar ---------- */
.menubar{height:24px;background:var(--menubar);color:var(--menubar-fg);display:flex;align-items:center;padding:0 14px;gap:2px;font:13px -apple-system,BlinkMacSystemFont,sans-serif;position:relative;z-index:30}
.menubar .apple{width:16px;margin-right:12px}
.menubar>button{all:unset;padding:1px 9px;border-radius:4px;cursor:default}
.menubar>button.app{font-weight:700}
.menubar>button[aria-expanded=true]{background:#1d6ff2;color:#fff}
.menubar .sys{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:12.5px}

/* ---------- tab strip ---------- */
.tabbar{height:42px;background:var(--tabbar);display:flex;align-items:flex-end;padding:0 12px 0 14px;gap:0;transition:background .35s}
.lights{display:flex;gap:8px;align-self:center;margin-right:22px}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.tabs{display:flex;align-items:flex-end;min-width:0}
.tab{all:unset;position:relative;height:34px;width:188px;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;border-radius:9px 9px 0 0;color:var(--tab-fg);font-size:13.5px;cursor:default;transition:background .35s}
.tab:not(.on){opacity:.85}
.tab:not(.on)+.tab:not(.on)::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:1px;background:currentColor;opacity:.25}
.tab.on{background:var(--tab);opacity:1}
.tab .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .x{all:unset;width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:15px;opacity:.7}
.tab .x:hover{background:#0000001a;opacity:1}
.tab .fav{width:14px;height:14px;border-radius:3px;flex:none;display:grid;place-items:center;font-size:9px;font-weight:900;color:#fff}
.newtab{all:unset;width:28px;height:28px;margin:0 0 3px 6px;display:grid;place-items:center;color:var(--tab-fg);font-size:22px;font-weight:300;border-radius:6px}
.newtab:hover{background:#0000001a}
.profile{margin-left:auto;align-self:center;width:24px;height:24px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;overflow:hidden}
#win[data-mode=open] .profile,#win[data-mode=personal] .profile,#win[data-mode=kids] .profile{background:transparent;color:#1d1d1f}
.profile img{width:100%;height:100%;object-fit:cover}

/* ---------- toolbar ---------- */
.toolbar{height:40px;background:var(--tb);display:flex;align-items:center;gap:4px;padding:0 12px;transition:background .35s;position:relative;z-index:20}
#win[data-mode=open] .toolbar{border-bottom:1px solid #e6e6e8}
.ib{all:unset;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--icon);cursor:default}
.ib:hover{background:#00000014}
.ib.dim{opacity:.45}
.ib svg{width:18px;height:18px}
.addr{flex:1;height:30px;margin:0 8px;border-radius:7px;background:var(--addr);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--addr-fg);transition:background .35s}
.addr{box-shadow:inset 0 0 0 1px var(--addr-line)}
.addr .sh{display:flex;align-items:center;padding-right:9px;border-right:1px solid currentColor;margin-right:2px;opacity:.85}
.addr input{all:unset;flex:1;font-size:13.5px;color:var(--addr-fg)}
.addr input::placeholder{color:var(--addr-fg);opacity:.85}
.pill{all:unset;height:30px;padding:0 16px 0 10px;border-radius:999px;background:var(--pill);color:var(--pill-fg);display:flex;align-items:center;gap:8px;font-size:14px;margin:0 4px;cursor:default;transition:background .35s,box-shadow .2s}
.pill{box-shadow:inset 0 0 0 1px var(--pill-line)}
.pill:hover{box-shadow:inset 0 0 0 1px var(--pill-line),0 0 0 3px #8882}
.pill svg{width:18px;height:18px}
.pill .lbl{display:flex;flex-direction:column;line-height:1}
.pill small{font-size:7.5px;font-weight:900;letter-spacing:.06em;color:#f2a24a}
#win[data-mode=open] .pill small,#win[data-mode=personal] .pill small{color:#e8590c}

/* ---------- page ---------- */
.content{position:absolute;top:82px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;background:var(--pg);transition:background .35s}
.content::-webkit-scrollbar{width:0}
.bgimg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bgimg img{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(22px) saturate(1.1);transform:scale(1.05)}
.bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000004d,#00000073)}
.pat{position:absolute;inset:0;pointer-events:none;background-repeat:repeat;background-size:880px auto}
.live .pat{animation:pan 60s linear infinite}@keyframes pan{to{background-position:880px 300px}}
@media (prefers-reduced-motion:reduce){.live .pat{animation:none}}
.blobs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;background:var(--blob);transition:background .35s}
.blobs i:nth-child(1){width:760px;height:620px;left:-260px;top:420px;border-radius:46% 54% 60% 40%}
.blobs i:nth-child(2){width:620px;height:420px;right:-120px;top:-210px;border-radius:40% 60% 45% 55%}
.blobs i:nth-child(3){width:520px;height:520px;right:-160px;bottom:-240px}
.live .blobs i{animation:drift 14s ease-in-out infinite alternate}.live .blobs i:nth-child(2){animation-duration:18s}.live .blobs i:nth-child(3){animation-duration:11s}
@keyframes drift{to{transform:translate(70px,-50px) rotate(25deg) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.live .blobs i{animation:none}}
.ntp{position:relative;padding:44px 70px 0 70px;max-width:1440px;margin:0 auto}
.fold{min-height:calc(100vh / var(--s,1) - 82px - 70px);position:relative}
.gear{position:absolute;top:16px;right:18px;display:flex;gap:10px;z-index:2}
.gear .ib{color:var(--fg);opacity:.8}
.hero{display:grid;grid-template-columns:82px 1fr;gap:0 0;align-items:start;max-width:900px}
.hero.center{margin:44px auto 0;max-width:700px;grid-template-columns:76px 1fr}
.hero .mi{width:60px;height:60px;color:var(--title);margin-top:2px;display:block}
.hero .mi.mk{background:var(--title);-webkit-mask:var(--m) left top/contain no-repeat;mask:var(--m) left top/contain no-repeat}
.hero h1{margin:0 0 10px;font-size:38px;font-weight:700;color:var(--title);letter-spacing:-.01em}
.hero p{margin:0 0 14px;font-size:15px;line-height:1.35;color:var(--fg);max-width:780px}
.hero p a{color:inherit;text-decoration:underline;cursor:default}
#win[data-mode=kids] .hero p a{color:#d39a14}
.toggle{all:unset;display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--fg);cursor:default}
.toggle i{width:28px;height:14px;border-radius:8px;background:#c9ccd3;position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;left:0;top:0;box-shadow:0 1px 2px #0004;transition:left .2s}
.toggle[aria-checked=true] i{background:var(--on)}.toggle[aria-checked=true] i::after{left:14px}
.toggle:focus-visible{outline:2px solid #4d8dff;outline-offset:3px;border-radius:4px}
.grid{display:grid;grid-template-columns:770px 382px;justify-content:space-between;margin-top:46px;margin-left:82px}
.grid.solo{grid-template-columns:1fr}
section h2{margin:0 0 12px;font-size:17px;font-weight:700;color:var(--fg)}
.sec{margin-bottom:34px}
.cards{display:flex;gap:15px;flex-wrap:wrap;max-width:1155px}
.secHd{display:flex;justify-content:space-between;align-items:baseline}
.hideBtn{all:unset;font-size:12.5px;color:var(--fg);opacity:0;cursor:pointer;transition:opacity .15s}
.rep:hover .hideBtn,.hideBtn:focus-visible{opacity:1}
.showRep{all:unset;font-size:12.5px;color:var(--accent);text-decoration:underline;cursor:pointer;margin-left:14px}
.card{all:unset;width:180px;border-radius:4px;overflow:hidden;box-shadow:0 1px 3px #0000002e;background:#fff;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:0 8px 18px #0000002e}
.card img{display:block;width:100%}
.more{all:unset;display:inline-block;margin-top:12px;font-size:13px;font-weight:700;text-decoration:underline;color:var(--accent);cursor:pointer}
.favs{display:flex;gap:15px}
.favs button{all:unset;width:60px;height:60px;border-radius:3px;overflow:hidden;box-shadow:0 1px 3px #00000026;background:#fff;cursor:pointer;transition:transform .15s}
.favs button:hover{transform:translateY(-2px)}
.favs img{width:100%;height:100%;display:block}
.games button{border-radius:50%;width:54px;height:54px;box-shadow:0 0 0 3px #fff}
.modes{display:flex;gap:18px}
.modes button{all:unset;width:52px;height:52px;border-radius:50%;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;box-shadow:0 2px 5px #0003}
.modes button img{width:100%;height:100%;display:block}
.modes{gap:18px}
.modes button:hover,.modes button:focus-visible{transform:scale(1.08);box-shadow:0 0 0 4px #ffffff88}
.modes button span{position:absolute;top:56px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;color:var(--fg);opacity:0;transition:opacity .15s;pointer-events:none}
.modes button:hover span,.modes button:focus-visible span{opacity:1}
.apps{display:flex;gap:15px}
.apps img{width:350px;display:block;box-shadow:0 1px 3px #0000002e;border-radius:2px}
.signin{all:unset;color:#1452a8;font-size:14px;font-weight:700;margin-left:6px;cursor:pointer}
.signin::before{content:"•";margin-right:10px}
.signin{color:var(--fg)!important;font-weight:400!important}
.apps.signed{align-items:flex-start}.apps.signed img:last-child{box-shadow:none;width:347px}
.report{background:#fff;color:#1d1d1f;border-radius:4px;box-shadow:0 2px 6px #0000001f;overflow:hidden}
.report .chart{padding:26px 30px 16px}
.report .mon{text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.04em}
.report .nums{display:flex;gap:52px;margin-top:6px}
.report .nums b{font-size:24px;font-weight:700}.report .nums b small{font-size:15px;font-weight:400;margin-left:2px}
.report .nums span{display:flex;align-items:center;gap:8px;font-size:14px;color:#555}
.report .nums span i{width:10px;height:10px;border-radius:50%;background:#1aa3d9}
.report .nums div+div span i{background:#e8403a}
.report .see{font-size:12.5px;color:#1a6fdc;font-weight:700;margin-top:8px}
.report .safe{border-top:1px solid #ececec;padding:22px 26px;display:grid;grid-template-columns:40px 1fr;gap:4px 12px}
.report .safe b{font-size:18px}
.report .safe p{grid-column:2;margin:0;font-size:12.5px;line-height:1.6}
.inc-box{background:#e6e8ec;color:#1d1d1f;border-radius:3px;display:flex;align-items:center;gap:24px;padding:22px 26px;font-size:14px;max-width:612px;box-shadow:0 2px 6px #0003}
.scrollhint{all:unset;display:block;margin:0 auto 30px;text-align:center;font-size:14px;color:var(--accent);cursor:pointer}
.scrollhint b{font-weight:900}
.scrollhint svg{display:block;margin:2px auto 0;width:12px}
.blog{position:relative;padding:24px 0 80px;display:flex;justify-content:center}
.blog img{width:750px;display:block;box-shadow:0 6px 24px #0003}
.minimal .grid,.minimal .scrollhint,.minimal .blog{display:none}

/* kids draw */
.draw{position:relative;background:#fff;border-radius:16px;height:440px;box-shadow:0 2px 8px #0000001a;overflow:hidden}
.draw canvas{position:absolute;inset:0;cursor:crosshair;touch-action:none}
.draw .ph{position:absolute;left:56px;top:28px;font:500 34px Caveat,cursive;color:#555;transform:rotate(-6deg);pointer-events:none;transition:opacity .2s}
.draw .ph svg{position:absolute;left:150px;top:30px;width:60px}
.pens{position:absolute;right:-1px;top:92px;width:52px;background:#fff;border:1px solid #e5e5e5;border-right:0;border-radius:14px 0 0 14px;padding:12px 0;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.pens button{all:unset;width:40px;height:16px;border-radius:8px 0 0 8px;background:var(--c);cursor:pointer;transition:width .15s}
.pens button[aria-pressed=true]{width:50px}
.pens .er{background:#f2a6a0}.pens .clr{all:unset;font-size:11px;color:#777;margin-right:8px;cursor:pointer}
.showc{position:absolute;right:0;bottom:0;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.kids-off .grid>div:first-child{visibility:hidden}

/* site page */
.site{position:relative;min-height:794px;display:grid;place-items:center;text-align:center;padding:40px}
.site .box{max-width:520px}
.site .badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--pill);color:var(--pill-fg);font-size:13px;margin-bottom:20px}
.site h1{margin:0 0 10px;font-size:30px;color:var(--fg)}
.site p{margin:0 0 20px;color:var(--muted);font-size:15px}
.site .blocked{width:64px;height:64px;margin:0 auto 18px;color:#e8403a}
.btn{all:unset;display:inline-block;padding:9px 18px;border-radius:6px;background:#1a6fdc;color:#fff;font-weight:700;font-size:14px;cursor:pointer}

/* ---------- popovers ---------- */
.pop{position:absolute;z-index:40;background:#fff;color:#1d1d1f;border-radius:8px;box-shadow:0 12px 40px #0000004d,0 0 0 1px #0000001a;display:none}
.pop.open{display:block;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.menu{padding:6px 0;font-size:13.5px;min-width:270px}
.menu .row{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:5px 16px;cursor:default;position:relative}
.menu .row:hover:not(.off),.menu .row:focus-visible,.menu .row.hl{background:#1d6ff2;color:#fff}
.menu .row:hover .sc,.menu .row.hl .sc{color:#fff}
.menu .row.off{color:#999}
.menu .sc{margin-left:auto;color:#888;font-size:12.5px;letter-spacing:.02em}
.menu .hd{padding:6px 16px 2px;font-size:11.5px;color:#888}
.menu hr{border:0;border-top:1px solid #e6e6e6;margin:5px 0}
.menu .mi2{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--t);flex:none;box-shadow:inset 0 0 0 1px #0000001f}
.menu .mi2 svg{width:12px;height:12px}
.menu .def{font-size:9px;font-weight:900;letter-spacing:.06em;color:#e8590c;margin-left:4px}
.menu .row:hover .def,.menu .row.hl .def{color:#ffd8c2}
.menu .chk{width:12px;font-size:12px}
.menu .arr{margin-left:auto;font-size:10px}
.menu .zoom{display:flex;align-items:center;gap:0;margin-left:auto}
.menu .zoom span{padding:0 10px;color:#555}
.sub{position:absolute;z-index:41}
.chg{width:262px;padding:16px 14px 14px}
.chg h3{margin:0 0 12px 4px;font-size:15px}
.chg .g{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.chg .tile{all:unset;cursor:pointer;display:block}
.chg .tile .sw{height:62px;border:1px solid #0000000d;border-radius:5px;background:var(--c);display:grid;place-items:center;color:var(--t);position:relative;transition:box-shadow .15s}
.chg .tile .sw svg{width:30px;height:30px}
.chg .tile:hover .sw,.chg .tile:focus-visible .sw{box-shadow:0 0 0 2px #1d6ff2}
.chg .tile[aria-current=true] .sw{box-shadow:0 0 0 2px #1d1d1f}
.chg .tile .nm{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:5px;white-space:nowrap}
.chg .tile .nm em{font-style:normal;font-size:8.5px;font-weight:900;letter-spacing:.05em;color:#e8590c}
.chg .tile .nm a{font-size:8.5px;font-weight:900;letter-spacing:.05em;color:#1d6ff2;opacity:0;cursor:pointer}
.chg .tile:hover .nm a{opacity:1}
.chg .info{position:absolute;top:5px;right:6px;width:15px;height:15px;border-radius:50%;border:1.3px solid currentColor;font:700 9px/12px Lato,sans-serif;text-align:center;opacity:.7}
.tip{position:absolute;z-index:45;background:#1d1d1f;color:#fff;border-radius:4px;padding:8px 10px;font-size:11.5px;line-height:1.35;width:180px;pointer-events:none;display:none}
.tip b{display:block;margin-bottom:2px}
.tip.open{display:block}
.qtip{position:absolute;z-index:45;background:#1d1d1f;color:#fff;border-radius:4px;padding:5px 9px;font-size:12px;pointer-events:none;white-space:nowrap;display:none}
.qtip.open{display:block}

/* appearance */
.appear{width:326px;padding:28px 24px 22px 30px;border-radius:4px}
.appear h3{margin:0 0 22px;font-size:19px}
.appear .r{all:unset;display:flex;align-items:center;justify-content:space-between;width:100%;font-size:14px;padding:12px 0;cursor:default}
.appear .r i{width:28px;height:15px;border-radius:8px;background:#bfc3ca;position:relative;transition:background .2s}
.appear .r i::after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;left:2px;top:2px;transition:left .2s}
.appear .r[aria-checked=true] i{background:#2b74e4}.appear .r[aria-checked=true] i::after{left:15px}

function initDraw(){
  const cv=$('cv'),box=$('draw');if(!cv)return;const r=window.devicePixelRatio||1;cv.width=box.clientWidth*2;cv.height=box.clientHeight*2;const x=cv.getContext('2d');x.scale(2,2);x.lineCap=x.lineJoin='round';
  let drawing=false,lx,ly;const pos=e=>{const b=cv.getBoundingClientRect(),k=box.clientWidth/b.width;return[(e.clientX-b.left)*k,(e.clientY-b.top)*k]};
  cv.onpointerdown=e=>{drawing=true;[lx,ly]=pos(e);cv.setPointerCapture(e.pointerId);$('ph').style.opacity=0};
  cv.onpointermove=e=>{if(!drawing)return;const[nx,ny]=pos(e);x.globalCompositeOperation=pen==='erase'?'destination-out':'source-over';x.strokeStyle=pen;x.lineWidth=pen==='erase'?22:pen==='#f2c230'?10:4;x.beginPath();x.moveTo(lx,ly);x.lineTo(nx,ny);x.stroke();lx=nx;ly=ny};
  cv.onpointerup=cv.onpointercancel=()=>drawing=false;
  $('pens').onclick=e=>{const b=e.target.closest('[data-c]');if(b){pen=b.dataset.c;$('pens').querySelectorAll('[data-c]').forEach(p=>p.setAttribute('aria-pressed',p===b))}if(e.target.id==='clr'){x.clearRect(0,0,cv.width,cv.height);$('ph').style.opacity=1}};
}

let pendingMode=null;
function switchMode(m,fromConfirm){

  S.mode=m;S.tabs=[{id:++S.uid,url:''}];S.active=0;content.scrollTop=0;render();toast(`New ${M[m].name} window`);
}
function confirmSwitch(to){
  if(S.mode==='kids'){pendingMode=to;openPin(true);return}
  const from=S.mode,sc=$('scrim'),priv=to==='incognito';
  const list=priv?['Browsing history won’t be saved','Cookies & site data are cleared when you close','Widgets won’t use your data','Auto suggestions will be turned off']:to==='kids'?['Only parent-approved sites will open','Other modes need the parent PIN','Browsing history can be seen by parents']:['Browsing history can be seen','Widgets installed will use the data','Cookies & site data will be retained','Auto suggestions & information will be enabled'];
  const grad=m=>({open:'#8f9196',incognito:'#121f44',personal:'#e2a94e',work:'#097862',developer:'#33495d',kids:'#e48aa0'})[m];

  sc.classList.add('open');$('dlgYes').focus();
  $('dlgNo').onclick=()=>sc.classList.remove('open');
  $('dlgYes').onclick=()=>{sc.classList.remove('open');const url=S.tabs[S.active].url;S.mode=to;S.tabs=[{id:++S.uid,url}];S.active=0;render();toast(`Tab moved to ${to==='incognito'?'Private':M[to].name} mode`)};

let pinVal='',pinTab=false;
function openPin(tab){
  pinTab=!!tab;pinVal='';const sc=$('scrim');
  sc.innerHTML=`<div class="pin" role="dialog" aria-modal="true" aria-labelledby="pinT"><div class="lk"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3a2a05" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div><h3 id="pinT">Child lock is on</h3><p>Enter the parent PIN to leave Kids mode.</p><div class="dots" id="dots"><i></i><i></i><i></i><i></i></div><div class="keys" id="keys">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('')}</div><button class="cx" id="pinCx">Stay in Kids mode</button><div class="hint">Demo PIN: 1234</div></div>`;

  if(pinVal.length===4)setTimeout(()=>{if(pinVal==='1234'){const m=pendingMode;$('scrim').classList.remove('open');pendingMode=null;if(pinTab){const url=S.tabs[S.active].url;S.mode=m;S.tabs=[{id:++S.uid,url}];S.active=0;render();toast(`Tab moved to ${M[m].name} mode`)}else switchMode(m,true)}else{dots.classList.remove('err');void dots.offsetWidth;dots.classList.add('err');pinVal='';[...dots.children].forEach(d=>d.classList.remove('f'))}},160);
}
let tt;function toast(s){const t=$('toast');t.textContent=s;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- tooltips + keys ---------- */
function qtip(el,text){el.addEventListener('mouseenter',()=>{const q=$('qtip'),wr=win.getBoundingClientRect(),k=wr.width/win.offsetWidth,r=el.getBoundingClientRect();q.textContent=text;q.classList.add('open');q.style.top=(r.bottom-wr.top)/k+8+'px';q.style.left=Math.min((r.left-wr.left)/k,win.offsetWidth-q.offsetWidth-8)+'px'});el.addEventListener('mouseleave',()=>$('qtip').classList.remove('open'))}
qtip($('pill'),'Change mode');qtip($('burger'),'Customize and control Ulaa');qtip($('shield'),'Privacy shield is on');
document.addEventListener('keydown',e=>{
  if($('scrim').classList.contains('open')){if($('dots')){if(/^[0-9]$/.test(e.key))press(e.key);if(e.key==='Backspace')press('⌫')}if(e.key==='Escape'){$('scrim').classList.remove('open');pendingMode=null}return}
  if(e.key==='Escape')closeAll();
  if(e.altKey&&(e.metaKey||e.ctrlKey)){const m=ORDER.find(x=>M[x].sc.endsWith(e.code.replace('Key','')));if(m){e.preventDefault();switchMode(m)}}
});
(function clock(){const d=new Date();$('clock').textContent=d.toLocaleDateString('en-US',{weekday:'short'})+' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});setTimeout(clock,30000)})();

newTab();render();fit();
</script>
